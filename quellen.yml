# Quellen der Sensorik.
#
# Jeder Scout liest ausschließlich seinen eigenen Block. Neue Quellen trägt der
# Betreiber ein, nicht die Agenten — sonst driftet die Sensorik dahin, wo am meisten
# Text liegt, statt dahin, wo die Signale sind.
#
# Regeln für alle Scouts:
#   - Rohsignal festhalten, nicht interpretieren.
#   - Immer mit Quell-URL und Abrufdatum.
#   - Keine Volltexte kopieren; zwei bis drei Sätze Zusammenfassung genügen.
#   - Ein Signal je Datei, Dateiname `JJJJ-MM-TT-thema.md`.

pain:
  beschreibung: >
    Geäußerter Ärger von Unternehmen. Gesucht wird wiederkehrende Klage über
    denselben Vorgang, nicht einzelne Wutausbrüche.
  suchmuster:
    - "nervt jedes Jahr"
    - "manuell abtippen"
    - "Excel-Liste pflegen"
    - "keiner macht das gern"
    - '"Pflicht ab"'
  quellen: []
    # Hier eintragen, z.B.:
    # - typ: forum
    #   url: https://…
    #   notiz: Handwerksbetriebe, hohe Aktivität dienstags

market:
  beschreibung: >
    Bewegungen im Wettbewerb. Besonders interessant: eingestellte Produkte
    (Nachfrage bleibt, Anbieter weg) und Preiserhöhungen (Unzufriedenheit entsteht).
    Ein unbesetzter Markt ist meist unbesetzt, weil dort kein Geld liegt — eine
    frisch entstandene Lücke dagegen hat zahlende Kunden, die niemand bedient.
  suchmuster:
    - "wird eingestellt zum"
    - '"End of Life" Software Mittelstand'
    - "Nachfolger gesucht für"
    - '"Preiserhöhung" SaaS Ankündigung Kunden'
    - '"kleinster Tarif" gestrichen'
    - Übernahme Produkt abgekündigt
  quellen: []

  # Kandidaten zum Eintragen: Änderungsprotokolle und Statusseiten der Werkzeuge,
  # die deine Zielbranchen tatsächlich einsetzen -- die kennt der Betreiber besser
  # als jede allgemeine Suche.

regulation:
  beschreibung: >
    Neue Pflichten für Unternehmen. Zwang erzeugt zahlungsbereite Nachfrage mit
    Stichtag — die verlässlichste Signalart überhaupt.
  beobachten:
    - E-Rechnungspflicht im B2B und ihre Ausbaustufen
    - Barrierefreiheitsstärkungsgesetz
    - NIS2 und Lieferkettenanforderungen
    - KI-Verordnung, Transparenz- und Kennzeichnungspflichten
    - Aufbewahrungs- und Meldepflichten mit neuen Fristen
  quellen: []

tech:
  beschreibung: >
    Neue Bausteine, die gestern noch nicht möglich waren. Relevant ist nur, was die
    Betriebskosten oder den Aufwand einer bekannten Aufgabe um eine Größenordnung senkt.
    Werkzeuge, die das Bauen erleichtern, zählen ausdrücklich nicht — Signale betreffen
    das Verkaufbare, nicht die Werkstatt.
  beobachten:
    - neue offene Schnittstellen deutscher Behörden und Register
    - Formate, die durch eine Pflicht erstmals maschinenlesbar werden
    - Dienste mit Nutzungsabrechnung, die eine Anschaffung ersetzen
    - Wegfall von Zugangshürden (Registrierung, Zertifikat, Mindestabnahme)
  suchmuster:
    - '"API" Behörde Deutschland neu verfügbar'
    - Schnittstelle Register maschinenlesbar
    - '"ab sofort verfügbar" Schnittstelle Verwaltung'
  quellen: []
