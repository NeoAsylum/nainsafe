# Quellen der Sensorik.
#
# Jeder Scout liest ausschließlich seinen eigenen Block. Neue Quellen trägt der
# Betreiber ein, nicht die Agenten — sonst driftet die Sensorik dahin, wo am meisten
# Text liegt, statt dahin, wo die Signale sind.
#
# Regeln für alle Scouts:
#   - Rohsignal festhalten, nicht interpretieren.
#   - Immer mit Quell-URL und Abrufdatum.
#   - Keine Volltexte kopieren; zwei bis drei Sätze Zusammenfassung genügen.
#   - Ein Signal je Datei, Dateiname `JJJJ-MM-TT-thema.md`.

pain:
  beschreibung: >
    Geäußerter Ärger von Unternehmen. Gesucht wird wiederkehrende Klage über
    denselben Vorgang, nicht einzelne Wutausbrüche.
  suchmuster:
    - "nervt jedes Jahr"
    - "manuell abtippen"
    - "Excel-Liste pflegen"
    - "keiner macht das gern"
    - '"Pflicht ab"'
  quellen: []
    # Hier eintragen, z.B.:
    # - typ: forum
    #   url: https://…
    #   notiz: Handwerksbetriebe, hohe Aktivität dienstags

market:
  beschreibung: >
    Bewegungen im Wettbewerb. Besonders interessant: eingestellte Produkte
    (Nachfrage bleibt, Anbieter weg) und Preiserhöhungen (Unzufriedenheit entsteht).
    Ein unbesetzter Markt ist meist unbesetzt, weil dort kein Geld liegt — eine
    frisch entstandene Lücke dagegen hat zahlende Kunden, die niemand bedient.
  suchmuster:
    - "wird eingestellt zum"
    - '"End of Life" Software Mittelstand'
    - "Nachfolger gesucht für"
    - '"Preiserhöhung" SaaS Ankündigung Kunden'
    - '"kleinster Tarif" gestrichen'
    - Übernahme Produkt abgekündigt
  quellen: []

  # Kandidaten zum Eintragen: Änderungsprotokolle und Statusseiten der Werkzeuge,
  # die deine Zielbranchen tatsächlich einsetzen -- die kennt der Betreiber besser
  # als jede allgemeine Suche.

regulation:
  beschreibung: >
    Neue Pflichten für Unternehmen. Zwang erzeugt zahlungsbereite Nachfrage mit
    Stichtag — die verlässlichste Signalart überhaupt.
  beobachten:
    - E-Rechnungspflicht im B2B und ihre Ausbaustufen
    - Barrierefreiheitsstärkungsgesetz
    - NIS2 und Lieferkettenanforderungen
    - KI-Verordnung, Transparenz- und Kennzeichnungspflichten
    - Aufbewahrungs- und Meldepflichten mit neuen Fristen
  quellen: []

tech:
  beschreibung: >
    Neue Bausteine, die gestern noch nicht möglich waren. Relevant ist nur, was die
    Betriebskosten oder den Aufwand einer bekannten Aufgabe um eine Größenordnung senkt.
    Werkzeuge, die das Bauen erleichtern, zählen ausdrücklich nicht — Signale betreffen
    das Verkaufbare, nicht die Werkstatt.
  beobachten:
    - neue offene Schnittstellen deutscher Behörden und Register
    - Formate, die durch eine Pflicht erstmals maschinenlesbar werden
    - Dienste mit Nutzungsabrechnung, die eine Anschaffung ersetzen
    - Wegfall von Zugangshürden (Registrierung, Zertifikat, Mindestabnahme)
  suchmuster:
    - '"API" Behörde Deutschland neu verfügbar'
    - Schnittstelle Register maschinenlesbar
    - '"ab sofort verfügbar" Schnittstelle Verwaltung'
  quellen: []

prozesse:
  beschreibung: >
    Suchraum des Prozess-Analysten. Seine Einheit ist der Vorgang, nicht die Branche.
    Der Markt-Analyst fragt "was macht diese Branche von Hand?", der Prozess-Analyst
    fragt "wer macht diesen Vorgang alles von Hand?" -- dieselben Daten, ganz andere
    Maerkte. Ein Vorgang je Lauf, gruendlich.
  warum: >
    Achtzehn Marktprofile, sechzehn davon potenzial: gering, fast immer mit der
    Begruendung "zu klein". Die handarbeit-Felder nebeneinandergelegt ergeben ein
    anderes Bild: Sechs Segmente nennen denselben Pruefnachweis, drei denselben
    Leistungsnachweis, drei dieselbe Behoerdenmeldung. Einzeln traegt keines die
    Schwelle aus G7, zusammen traegt jedes. Abrechnung, Terminbuchung und
    Nachweisfuehrung sind Prozessthemen und branchenuebergreifend; wer sie je Branche
    sucht, findet je Branche einen zu kleinen Markt.
  regel: >
    Die Vereinigung zaehlt nur, wenn der Vorgang wirklich derselbe ist. Ist die
    branchenspezifische Schale groesser als der gemeinsame Kern, sind es fuenf
    Vorgaenge mit einem Oberbegriff und kein Markt. Und ein Vorgang, den ein gutes
    horizontales Werkzeug bereits loest, ist tot -- der Preisboden steht dann.
  vorgaenge:
    # --- Aus den vorhandenen Marktprofilen abgeleitet, mit Belegen im Repo ---
    # Die Reihenfolge folgt der Staerke: zuerst Vorgaenge mit gesetzlichem Zwang und
    # ohne bekanntes horizontales Werkzeug.
    - Wiederkehrende Pruefung mit gesetzlicher Frist und Nachweispflicht
    - Behoerdenmeldung je Vorgang mit Formular und Frist
    - Leistungsnachweis gegenueber einem Kostentraeger
    - Wiederkehrende Verbrauchsabrechnung mit Zaehlerablesung
    - Nachweis der Qualifikation und Unterweisung von Mitarbeitern
    - Ausgefallene Termine kurzfristig wiederbesetzen
    - Beitrags- und Mitgliedsabrechnung mit Zahlungsnachlauf
    # Kontrollprobe: bekannt besetzt (12 KI-Diktatanbieter allein bei Tierarztpraxen).
    # Steht bewusst auf der Liste -- ein Profil, das hier sauber "tot" begruendet,
    # eicht das Urteil der Rolle.
    - Vorgangsdokumentation per Diktat statt Tastatur

maerkte:
  beschreibung: >
    Suchraum des Markt-Analysten. Er arbeitet diese Liste der Reihe nach ab, statt
    immer die naheliegenden Branchen zu nehmen. Ein Segment je Lauf, gruendlich.
    Ergaenze die Liste, wenn dir eines fehlt — der Analyst darf sie nicht selbst
    aendern.
  regel: >
    Ausgeschlossen bleibt alles, was unter Grenze G1 faellt: Versicherung, Bausparen,
    Finanzdienstleistung samt zugehoeriger IT. Die Grenze betrifft die Branche, nicht
    das Land.
  schwelle: >
    Seit 2026-08-29 gilt eine Mindestgroesse: Preis mal erreichbare Kundenzahl muss
    5.000 EUR Marge im Monat tragen koennen (G7). Sechzehn der ersten zweiundzwanzig
    Segmente kamen auf potenzial: gering, und der haeufigste Grund war dieselbe Zahl —
    ein paar tausend Betriebe mit einem Zahlungsbereitschaftsdeckel von dreissig Euro.
    Ein deutsches Handwerkssegment kann diese Schwelle fast nur ueber einen hohen Preis
    erreichen, nicht ueber Menge. Die beiden neuen Bloecke unten drehen das um.
  reihenfolge: >
    Der Analyst arbeitet von oben nach unten. Die beiden neuen Bloecke stehen seit
    2026-08-29 vor dem deutschen, weil dieser sechzehn von zweiundzwanzig Segmenten
    als potenzial: gering geliefert hat und der haeufigste Grund die Groesse war.
    Die sieben offenen deutschen Segmente bleiben in der Liste -- sie sind nicht
    widerlegt, nur nachrangig.
  segmente:
    # --- Englischsprachiger B2B-Markt ---
    # Dieselbe Betriebsart, aber im Sprachraum US/UK/CA/AU/IE/NZ statt in einem Land.
    # Das ist der eine Hebel, der aus dreitausend Betrieben hunderttausend macht, ohne
    # dass sich am Produkt etwas aendert. Der Preis steht in G7: Umsatzsteuer im
    # Zielland, handhabbar nur ueber einen Merchant of Record.
    - Tierarztpraxen im englischsprachigen Raum
    - Fahrschulen im englischsprachigen Raum
    - Tanz-, Kampfsport- und Musikstudios mit Kursbetrieb
    - Baumpflege und Gartenbaubetriebe (arborists, landscapers)
    - Pool- und Spa-Wartungsdienste
    - Selfstorage- und Lagerraumbetreiber
    - Verwalter von Kurzzeitvermietungen (short-term rental managers)
    - Mobile Dienstleister mit Routenplanung (Reinigung, Aufbereitung, Wartung)

    # --- Unterhaltung: Simulation mit auslesbarem Zustand ---
    # Seit 2026-08-31, auf Wunsch des Betreibers. Die Begruendung ist nicht, dass
    # Unterhaltung leichter waere -- sie ist es nicht, der Steam-Median lag 2025 bei
    # 249 $ Jahresumsatz je Spiel. Sie ist, dass hier als einzigem Suchraum kein
    # Platzhirsch dasselbe Problem schon gratis loest: 40 von 45 roten Recherchen sind
    # genau daran gestorben, hier gibt es das Kriterium gar nicht.
    #
    # Der Zuschnitt ist eng und folgt G8: Simulation und Automation, deren Zustand aus
    # Zahlen besteht. Nur dort kann die Fabrik ihr eigenes Produkt pruefen -- Balance,
    # Verlauf, Wirtschaftskreislauf und Loesbarkeit sind messbar, "macht Spass" ist es
    # nicht. Und es ist das Genre mit dem hoechsten Umsatz je Sichtbarkeit
    # (Bewertungs-zu-Verkaufs-Verhaeltnis 60-80x gegenueber 40-50x bei Action).
    - Aufbau- und Wirtschaftssimulationen mit auslesbarem Zustand
    - Automatisierungs- und Fabrikspiele (factory/automation)
    - Management- und Betriebssimulationen (Job- und Betriebssimulatoren)
    # Vorschlag des Betreibers vom 2026-08-31: Weltwirtschaft aus Politik,
    # Regulierung, Handel und Unternehmen. Auf agentenbau.md gemessen der bisher
    # beste Treffer -- der Zustand IST eine Zahlentabelle, und das Genre hat als
    # einziges eine zweite Pruefachse: Der Modellauf laesst sich gegen echte
    # Wirtschaftszeitreihen halten. Beim Profil besonders zu pruefen:
    #   - Democracy 4 (Positech, Ein-Personen-Studio, reine Zahlen- und
    #     Knotenoberflaeche) als naechstes Vergleichsstueck -- Verkaufszahl, Preis,
    #     Bewertungen. Ist das Segment gross genug fuer ein Ein-Personen-Produkt?
    #   - Victoria 3, Capitalism Lab, Offworld Trading Company, Workers & Resources
    #   - der ungeloeste Wunsch: Was fordern Spieler dieser Titel wiederholt, das
    #     keiner liefert? Beim Automatisierungsprofil war genau das nicht belegbar.
    #   - Zuschnitt vom 2026-08-31, geschaerft: Der Spieler ist ein Hedgefonds und
    #     versucht die Welt zu uebernehmen -- ueber Finanzmaerkte, Lobbyismus und
    #     Korruption. Rolle und Siegbedingung statt Sandkasten. **Die echte Welt, mit
    #     echten Daten**, ausdruecklich keine erfundene: Nur dann steht die vierte
    #     Pruefachse aus agentenbau.md offen (Rueckvergleich gegen Zeitreihen).
    #     Genehmigungsfrage ist geklaert, siehe grenzen.md und lehren.md.
    #     Vor dem ersten Entwurf zu klaeren: Welche Datenquelle erlaubt gewerbliche
    #     Weiterverbreitung? Das entscheidet, ob das Modell ausgeliefert werden darf.
    - Volkswirtschafts- und Politiksimulation (Handel, Regulierung, Unternehmen)

    # --- Endkunden und Prosumer ---
    # B2C ist seit 2026-08-29 erlaubt (G7). Der Grund ist nicht der Preis, sondern
    # G3: Endkunden bedienen sich selbst und suchen aktiv — genau der Kanal, an dem
    # bisher jede zweite Idee gestorben ist. Gesucht wird Freizeit oder Nebenerwerb
    # mit wiederkehrender Buchfuehrung, Sammlung oder Planung: dort entsteht der
    # Zustand, den G8 verlangt, ganz von selbst.
    - Ahnenforschung und Familienarchive
    - Aquaristik und Terraristik mit Bestandsfuehrung
    - Hobbyimkerei und Kleintierhaltung
    - Sammler mit Bestandswert (Muenzen, Karten, Schallplatten, Modellbau)
    - Selfpublisher und Kleinverlage
    - Betreiber von Newslettern und Podcasts ohne Redaktion
    - Verkaeufer auf Marktplaetzen (Etsy, eBay, Kleinanzeigen) im Nebenerwerb
    - Kleingartenvereine und Selbstversorger mit Anbauplanung
    - Spielleiter und Gruppen von Tabletop- und Rollenspielen
    - Amateurastronomie und Naturbeobachtung mit Beobachtungsjournal

    # --- Deutscher Mittelstand: Rest der urspruenglichen Liste ---
    # Handwerk mit vielen kleinen Betrieben und wiederkehrender Dokumentation
    - Dachdeckerbetriebe
    - Elektroinstallationsbetriebe
    - Sanitaer-, Heizungs- und Klimabetriebe
    - Schaedlingsbekaempfer
    - Kaelte- und Klimaanlagenwartung
    - Aufzugswartung und Pruefdienste
    # Gesundheit und Pflege ausserhalb der Heilkunde
    - Ambulante Pflegedienste
    - Physiotherapiepraxen
    - Tierarztpraxen
    - Hebammen und Geburtshaeuser
    # Betreute Objekte und Anlagen
    - Hausverwaltungen fuer Wohnungseigentum
    - Facility-Dienstleister fuer Kleinobjekte
    - Betreiber von Spielplaetzen und Sportanlagen
    - Campingplaetze und Ferienparks
    # Transport, Logistik, Landwirtschaft
    - Speditionen unter fuenfzig Fahrzeugen
    - Landwirtschaftliche Lohnunternehmen
    - Imkereien und Direktvermarkter
    # Bildung, Vereine, Kultur
    - Musikschulen und private Bildungstraeger
    - Sportvereine mit Hauptamtlichen
    - Kleine Museen und Gedenkstaetten
    # Gastgewerbe und Veranstaltung
    - Caterer und Eventgastronomie
    - Betreiber von Ferienwohnungen mit mehreren Objekten
