# ---------------------------------------------------------------------
# WAS DIESE DATEI IST
#
# T27: "Die Kalibrierdatei liegt ausserhalb des Codes, und jeder
# Schluessel traegt eine Skalenklasse." Hier steht die *Form* -- jeder
# Schluessel, seine Skalenklasse nach T5, sein Wertebereich, die Stelle
# in specs/, aus der die Schranke stammt, und wer ihn kalibriert.
#
# ---------------------------------------------------------------------
# WAS DIESE DATEI NICHT IST
#
# **Keine Zahl in dieser Datei ist kalibriert.** spiel.md ("Offene
# Entwurfsfragen") und technik.md Abschnitt 12 sagen dasselbe: Die Werte
# werden vom Selbstspieler *gesucht*, nicht entworfen.
#
# Regel fuer jeden Platzhalter, damit keiner wie ein Ergebnis aussieht:
#
#   A) Skalare: Wo eine untere Schranke steht, ist der Platzhalter genau
#      diese Schranke; wo keine steht, 0. **Ist die Schranke ein anderer
#      Schluessel und die Ungleichung streng (`>` statt `>=`), bleibt
#      der Schluessel, dessen Schranke aus der Klasse kommt, auf der
#      Klassenschranke, und der andere rueckt genau einen ganzzahligen
#      Schritt weiter.** Der Zusatz stammt aus Ruecklauf 1: Regel A ohne
#      ihn liest sich so, als duerfe auch bei einer strengen Ungleichung
#      jeder der beiden auf derselben Zahl stehen -- und genau das war
#      `startzustimmung = 0` neben `zustimmung_wechselschwelle = 0`,
#      zwei Werte ausserhalb ihrer eigenen Schranke. **Streng geordnete
#      Paare gibt es drei** -- `aufsicht_schwelle_1 < _2`, `_2 < _3` und
#      `startzustimmung > zustimmung_wechselschwelle` --, und der Zusatz
#      gilt fuer alle drei; bei den Aufsichtsschwellen ist er sichtbar
#      angewandt (1, 2, 3, je ein ganzzahliger Schritt). **Verletzt hatte
#      seine Schranke genau eines davon**, das dritte. Der Satz stand bis
#      Fassung 2 als "Betroffen ist genau ein Paar" hier und liess beide
#      Lesarten zu (Ruecklauf 2, Hinweis des Pruefers ohne Befundrang).
#      Die Aufzaehlung aller gekoppelten Paare steht unter BEFUNDE
#      Punkt 5.
#   B) Wertebereiche der Instrumente: Der Wertebereich ist keine
#      Kalibriergroesse im selben Sinn -- er muss nach T51 im `weltlauf`
#      den historischen Pfad enthalten, sonst erzeugt der Jahrgangsbau
#      einen Befund. Der Platzhalter ist deshalb **weit**, nicht eng.
#      Weit heisst: er schraenkt nichts ein und nimmt nichts vorweg.
#      Die Zahl, die ihn eng macht, ist eine Kalibrierung.
#
# **Folge, ausdruecklich benannt:** Dieser Satz ist zulaessig, aber
# wirkungslos. `druck_max = 1`, `gegenlobby_satz = 0`, `hebel_max = 0`
# und `nachahmer_max = 0` schalten Lobbyismus, Gegenlobby, Hebel und
# Nachahmer praktisch ab. Das ist Absicht: Ein Satz, in dem jede Zahl an
# ihrer Schranke klebt, kann von niemandem fuer ein Ergebnis gehalten
# werden. Die erste Aufgabe des Selbstspielers ist, einen zu finden, der
# nicht wirkungslos ist.
#
# **Wirkungslos heisst nicht folgenlos, und der Unterschied hat einen
# Fehler gekostet.** Ein Platzhalter auf seiner Schranke schaltet eine
# Wirkung ab; ein Platzhalter *ausserhalb* seiner Schranke loest eine
# aus. `startzustimmung = 0` bei `zustimmung_wechselschwelle = 0` liess
# in Runde 1 die Regierung in allen vier Laendern wechseln, bevor der
# Fonds eine Aktion getan hatte -- kein wirkungsloser Satz, sondern ein
# aktiver. Deshalb ist die Probe auf die eigene Schranke bei jedem
# gekoppelten Paar zu rechnen und nicht nur bei dem, das gerade
# auffaellt (BEFUNDE Punkt 5).
#
# ---------------------------------------------------------------------
# LESEART DER WERTE
#
# T27: "Alle Werte werden als Dezimalzeichenketten in skalierte
# Ganzzahlen gelesen (T4) und in eine Struktur mit benannten Feldern
# gefuellt, nie ueber eine Schleife ueber Schluessel (T9)."
#
# Hier stehen sie als **TOML-Ganzzahlen**, nicht als Zeichenketten in
# Anfuehrungszeichen. Begruendung, und sie ist eine Entscheidung dieses
# Pakets: Eine TOML-Ganzzahl ist per Sprachdefinition ein i64; ein Wert
# mit Dezimalpunkt waere eine TOML-Gleitkommazahl und faellt damit schon
# beim Einlesen auf, statt erst beim Umwandeln. Das Verbot aus T4 wird so
# vom Parser getragen und nicht von unserem Code. Als Zeichenkette waere
# "1.5" ein gueltiger TOML-Wert. -- Gemeldet im Logbuch; wer es anders
# will, braucht eine Zeile in einem Befund, keinen ADR.
#
# ---------------------------------------------------------------------
# SKALENKLASSEN (T5), soweit sie hier vorkommen
#
#   1  Fondsgeld ................ US-Cent
#   3  Raten .................... Basispunkte (1 bp = 0,01 %)
#   4  Anteile .................. Zehntausendstel (10.000 = 100 %)
#   9  Lobbydruck ............... Lobbypunkte, 0 ... druck_max
#  10  Instrumentenstufe ........ Stufe, 0 ... regulierung_stufen
#  11  Zaehler und Restdauern ... Stueck bzw. Runden
#
# ---------------------------------------------------------------------
# WIE DER PRUEFER ZAEHLT
#
#   Gruppe A, Tabelle in T27 ....................... 10 Skalare
#   Gruppe A, Instrumente nach T51 .. 4 x 3 ........ 12
#   Gruppe B, Fliesstext in T27 .................... 12
#   Gruppe B2, "Verzoegerungen" aus T27 ............  4
#   Gruppe C, "Elastizitaeten" aus T27 ............. 12
#                                                   ---
#                                                    50 Schluessel
#
#   Davon 46 Schluesselzeilen mit der Marke PLATZHALTER und 4 mit der
#   Marke FEST (T51). Nachgezaehlt wird mit einem Ausdruck, der **nur
#   Schluesselzeilen** trifft -- ein Kommentar beginnt mit `#` und faellt
#   dadurch heraus:
#     grep -c '^[a-z_0-9]* *=.*PLATZHALTER'  -> 46
#     grep -c '^[a-z_0-9]* *=.*FEST (T51)'   -> 4
#   Der unverankerte Aufruf, der bis Fassung 2 hier stand, zaehlte diese
#   Kopfzeilen mit und lieferte 47 und 5 statt 46 und 4 (Ruecklauf 2,
#   Befund 3). Die beiden Zahlen waren richtig, der vorgeschriebene
#   Pruefweg nicht -- eine Selbstprobe, die sich selbst mitzaehlt, ist
#   keine.
#
# **Ein `*` hinter einem Schluesselnamen im Kommentar heisst: Der Name
# steht in keinem Dokument woertlich und ist nach dem Muster der
# uebrigen gebildet.** Verwandt, aber nicht dieselbe Kennzeichnung wie
# im Adressverzeichnis: Dort -- `daten/adressen.md`, Spaltenlegende
# `Adresse` und *Befund 2* -- sitzt die Marke an den Bestandteilen und
# heisst "ein Bestandteil ist neu erfunden", weshalb `handel.US.CN.1`
# dort keine Marke traegt, obwohl diese Zeichenkette nirgends
# woertlich steht; hier heisst sie "nicht woertlich belegt". Von den
# drei Indexarten, die `daten/adressen.md` an beiden genannten
# Stellen aufzaehlt -- Gebiets-, Sektor- und Instrumentenindex --,
# kommt in dieser Datei genau eine vor: der Instrumentenindex der
# vier Tabellen `[instrument.leitzins]`, `[instrument.zoll]`,
# `[instrument.haushalt]` und `[instrument.regulierung]`; einen
# Gebiets- oder Sektorindex traegt kein Schluessel hier. An den neun
# Schluesseln der Instrumente `leitzins`, `zoll` und `haushalt`
# ergeben beide Regeln dasselbe -- keine Marke --, an den drei
# Schluesseln unter `[instrument.regulierung]` dagegen nicht:
# Woertlich belegt sind alle zwoelf (BEFUNDE Punkt 1: "schrittweite /
# instrument_min / instrument_max in den vier Instrumententabellen"),
# aber die Instrumentenkennung `regulierung` fuehrt
# `daten/adressen.md` in seiner Bildungsregeltabelle als gebildet
# (Zeile "Instrumentenkennung der Finanzmarktregulierung"), weshalb
# dort `land.<L>.instrument.regulierung.stand` (Nr. 37, 81, 125, 169)
# als einzige der vier Instrumentenadressen eine Marke traegt. Die
# Abweichung hat in dieser Datei also genau einen Fall, und er kostet
# keine Marke: Hier gilt die Regel dieser Datei, und nach ihr bleiben
# `schrittweite`, `instrument_min` und `instrument_max` unter
# `[instrument.regulierung]` unmarkiert.
# 25 der 50 Namen sind so gebildet; sie stehen einzeln
# unter BEFUNDE am Dateiende.
#
# ---------------------------------------------------------------------
# WAS HIER BEWUSST NICHT STEHT
#
# * `leitzins_start[l]` -- keine Kalibriergroesse, sondern eine Messung;
#   sie steht im Jahrgang (T27, T23 Punkt 5).
# * `durchgriff` -- Konstante des Jahrgangs (T23 Punkt 5).
# * `markt.wert` (Startkorb zu Startpreisen) -- Manifest (T33, T45).
# * Die Partielaenge R -- Groesse des Jahrgangs, `R =
#   manifest.stuetzstellen - 1`, keine Konstante des Codes (T40).
# * Die Pruefsumme des Parametersatzes -- sie wird ueber diese Datei
#   *gerechnet* und in `partie.parameter_pruefsumme` abgelegt (T27, T45).
#   Ein Schluessel dafuer in dieser Datei waere die Pruefsumme ihrer
#   selbst.
# * Zahlen, die spiel.md bereits festlegt und die deshalb keine
#   Kalibriergroessen sind: drei Aktionen je Runde, zwei Runden
#   Ausstiegsdauer der Beteiligung, drei Runden bis zum Anlegerabzug,
#   eine Runde Verzug des Gegendrucks, Faktor 2 auf die Lobbykosten nach
#   einem Regierungswechsel, 40 Halbierungsschritte der Marktraeumung
#   (T28).
#
# Diese Datei traegt **keinen Datenanker**. Sie enthaelt keine Zahl aus
# einer externen Quelle, also auch keine Namensnennung; die Lizenzen und
# ihre Namensnennung gehoeren zum Jahrgang und stehen in dessen
# Manifest (T23).
# =====================================================================


