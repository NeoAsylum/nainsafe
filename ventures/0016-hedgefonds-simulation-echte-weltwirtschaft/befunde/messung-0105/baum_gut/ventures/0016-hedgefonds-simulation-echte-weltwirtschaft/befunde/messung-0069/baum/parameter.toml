#   und nicht nur im Logbuch** -- der Pruefer soll die Alternative sehen,
#   ohne sie sich selbst herleiten zu muessen.
#   Eine obere Schranke nennt specs/ nicht.
# Kalibriert: Selbstspieler.
# Scheitert daran: Zu klein -- Sichtbarkeit ist auf der Kostenseite
#   praktisch gratis und die Wahl "laut und schnell gegen leise und
#   langsam" hat nur eine Seite. Zu gross -- jeder Hebel auf einem
#   sichtbaren Fonds ist unbezahlbar, Aktion 4 entfaellt und mit ihr die
#   Angriffsflaeche der ersten Todesart.
hebelaufschlag = 1  # PLATZHALTER

# `sichtbarkeit_schritt`* -- Klasse 4 (Anteile). Aenderung von
# `fonds.sichtbarkeit` je Aktion 5 (spiel.md Aktion 5: "Der Fonds legt
# eine Position oeffentlich offen oder zieht sich zurueck").
# Schranke: 0 ... 10.000 aus der Klasse (T5).
# Kalibriert: Selbstspieler.
# Scheitert daran: Bei 0 ist Aktion 5 wirkungslos; zu gross -- eine
#   einzige Aktion schaltet zwischen unsichtbar und voll sichtbar, und
#   die Entscheidung wird binaer statt dosierbar.
sichtbarkeit_schritt = 0  # PLATZHALTER

# `innerjahresausschlag_faktor`* -- Klasse 4 (Anteile). Gewicht der
# historischen Schwankungsbreite des Landes im Innerjahresausschlag,
# gegen den der Hebel in Schritt 6 geprueft wird (spiel.md "Was bewusst
# fehlt": "Der Hebel wird nicht gegen den Jahresendstand geprueft,
# sondern gegen einen Innerjahresausschlag, der deterministisch aus der
# Jahresbewegung und der historischen Schwankungsbreite des Landes
# folgt"). Die Schwankungsbreite selbst ist eine Kennzahl des Jahrgangs
# (T23 Punkt 6, mittlere absolute Jahresaenderung); hier steht nur ihr
# Gewicht.
# Schranke: >= 0.
# Kalibriert: Selbstspieler.
# Scheitert daran: Bei 0 wird der Hebel gegen den Jahresendstand
#   geprueft -- genau das, was spiel.md ausschliesst -- und Todesart 1
#   verliert ihren Ersatz fuer das fehlende Quartalsraster.
innerjahresausschlag_faktor = 0  # PLATZHALTER


# ---------------------------------------------------------------------
# GRUPPE A, Fortsetzung -- die Instrumente nach T51
#
# Feste Reihenfolge nach T9: leitzins, zoll, haushalt, regulierung.
# Die drei Schluesselnamen je Instrument stehen woertlich in T27
# (`schrittweite[i]`, `instrument_min[i]`, `instrument_max[i]`); als
# Tabelle je Instrument statt als Feld ueber einen Index, weil T27 die
# Struktur mit **benannten Feldern** verlangt und eine Schleife ueber
# Schluessel ausschliesst (T9).
#
# Nach jeder Bewegung in Schritt 3 gilt
# `stand = min(max(stand +/- schritt, min), max)`; die Kappung traegt die
# Ursache des ausloesenden Drucks und nicht `Vortrag`, damit die Kette
# aus T18 sagt, *dass* gekappt wurde (T51).
#
# **Im `weltlauf` gilt die Schrittweite nicht** -- der historische Pfad
# ist dort die Wahrheit und darf in einem Jahr weiter springen --, **der
# Wertebereich schon**: Verlaesst der Pfad ihn, ist das ein Befund des
# Jahrgangsbaus und kein stilles Kappen einer Sollgroesse (T51). Daraus
# folgt Regel B fuer die Platzhalter: Die Wertebereiche stehen hier
# **weit**. Ein enger Wertebereich waere eine Kalibrierung.
#
# **Die Schranke der Schrittweite, einmal fuer alle vier Instrumente**
# (nachgetragen im Ruecklauf 1, Befund 4 des Pruefbefunds vom
# 2026-09-02 -- drei der vier Tabellen trugen fuer `schrittweite` weder
# Wertebereich noch Herkunft):
#
#   `schrittweite >= 1`, ganzzahlig.
#
# Herkunft, in zwei Schritten und beide belegt:
#   * technik.md T5, Erlaeuterung zu Klasse 10 unter der Klassentabelle
#     (Aufzaehlungspunkt "**Instrumentenstufe (10).**") sagt woertlich,
#     "hoechstens ein Schritt je Runde" heisse bei der
#     Finanzmarktregulierung **eine Stufe**, "bei den anderen dreien
#     `schrittweite[instrument]` Basispunkte aus `parameter.toml`". Die
#     vier Schrittweiten sind
#     damit dieselbe Groesse in vier Einheiten, und T51 setzt die eine,
#     die es beziffert, auf 1 -- den kleinsten positiven Wert ihrer
#     Klasse. Was fuer die bezifferte gilt, gilt der Form nach fuer die
#     drei unbezifferten.
#   * Die beiden Ausfaelle sind aus der Bewegungsregel von T51 ablesbar,
#     `stand = min(max(stand +/- schritt, min), max)`: Bei
#     `schrittweite = 0` steht das Instrument in jeder Runde still,
#     Aktion 3 und die faelligen Verzoegerungen aus Schritt 3 laufen ins
#     Leere, und **nichts bricht ab** -- der Fehler wuerde sich erst am
#     Selbstspieler zeigen. Bei `schrittweite < 0` kehrt sich die
#     Richtung jeder Bewegung um, weil das Vorzeichen in `+/-` schon die
#     Richtung des ausloesenden Drucks traegt; das Instrument bewegte
#     sich gegen den, der es bezahlt hat.
#
# **Es ist eine Folgerung, keine woertliche Vorgabe**, und als solche
# gekennzeichnet -- dieselbe Bauart wie `stufen_max >= 1` und
# `druck_max >= 1`. T51 beziffert `schrittweite` fuer Leitzins, Zoll und
# Haushalt nicht.
#
# **Eine obere Schranke nennt specs/ fuer die Schrittweite nicht.**
# Wirksam begrenzt ist die *Wirkung* durch den Wertebereich desselben
# Instruments: Eine Weite ueber `instrument_max - instrument_min` traegt
# den Stand in einem Schritt von einer Grenze zur anderen, die Kappung
# aus T51 faengt sie ab, und "hoechstens ein Schritt je Runde" ist dann
# keine Daempfung mehr. Dieselbe Unterscheidung zwischen dem Bereich der
# Groesse und dem Bereich des Reglers wie bei `gegenlobby_satz`
# (Klasse 9, begrenzt ist das Ergebnis durch `druck_max`).
# ---------------------------------------------------------------------

# Klasse 3 (Raten, bp). Datenanker Reihe 9 (IWF IFS); fuer Deutschland
# exogen ab 1999, also ab Runde 3 (spiel.md, T23 Punkt 8).
# `instrument_min` traegt die einzige Schranke des Modells, an der ein
# Kurs unendlich wird: **`instrument_min >= 1 - aufschlag`** (T51). Mit
# `aufschlag = 51` heisst das `>= -50`; der Platzhalter steht genau
# darauf, weil der tiefste bekannte Stand im Pruefjahrgang der
# EZB-Einlagesatz von -0,50 % ist (T23 Punkt 5).
# `instrument_max` weit: Brasiliens Leitzins liegt am Anfang des
# Pruefjahrgangs im zweistelligen Prozentbereich, ein enger Wert erzeugte
# einen Befund des Jahrgangsbaus.
# `schrittweite`: Klasse 3 (Raten, bp), Schranke `>= 1` und ganzzahlig
#   nach dem Gruppenkopf oben (technik.md T5, Erlaeuterung zu Klasse 10,
#   Aufzaehlungspunkt "Instrumentenstufe (10)", mit T51,
#   Folgerung). Keine obere aus specs/; wirksam wird sie bei
#   `instrument_max - instrument_min = 10.050` bp -- darueber traegt ein
#   Schritt den Zins von einer Grenze zur anderen.
# Kalibriert: Selbstspieler (`schrittweite`); die beiden Grenzen sind
#   gegen den Jahrgang zu pruefen, nicht zu suchen.
# Scheitert daran: `schrittweite` zu klein -- der Spieler bewegt den Zins
#   in R Runden nicht spuerbar; zu gross -- ein Schritt je Runde ist
#   keine Daempfung von Kanal 8 mehr.
[instrument.leitzins]
schrittweite = 1  # PLATZHALTER
instrument_min = -50  # PLATZHALTER
instrument_max = 10000  # PLATZHALTER

# Klasse 3 (Raten, bp). Aggregiertes Zollniveau je Land, Datenanker
# Reihe 13 (WDI aus WITS) -- **die Reihe mit dem entscheidenden
# Lizenzverdacht** (T26, T51). Faellt sie aus, laeuft der Weltlauf mit
# konstantem Zoll und das Orakel traegt zwei statt drei verankerte
# Instrumente; an dieser Datei aendert das nichts.
# `instrument_min` ist nach T51 **fest 0** -- der Wertebereich lautet
# dort `0 ... instrument_max[zoll]`, ein negativer Zoll waere eine
# Subvention und ist im Modell nicht vorgesehen.
# `schrittweite`: Klasse 3 (Raten, bp), Schranke `>= 1` und ganzzahlig
#   nach dem Gruppenkopf oben (technik.md T5, Erlaeuterung zu Klasse 10,
#   Aufzaehlungspunkt "Instrumentenstufe (10)", mit T51,
#   Folgerung). Keine obere aus specs/; wirksam wird sie bei
#   `instrument_max - instrument_min = 10.000` bp.
# Kalibriert: Selbstspieler (`schrittweite`).
# Scheitert daran: `schrittweite` zu klein -- der Spieler bewegt den Zoll
#   in R Runden nicht spuerbar; zu gross -- keine Daempfung von Kanal 8.
#   `instrument_max` zu eng -- der historische Pfad verlaesst den Bereich
#   und der Jahrgangsbau meldet einen Befund.
[instrument.zoll]
schrittweite = 1  # PLATZHALTER
instrument_min = 0  # FEST (T51)
instrument_max = 10000  # PLATZHALTER

# Klasse 3 (Raten, bp). Haushaltssaldo bzw. Staatsausgabenquote,
# Datenanker Reihe 12 (IWF WEO). T51 nennt fuer beide Grenzen keine
# Zahl und keine Bedingung; beide sind gegen den historischen Pfad zu
# pruefen. Der Saldo ist im Pruefjahrgang in mehreren Laendern deutlich
# negativ, der Platzhalter deshalb weit nach unten offen.
# `schrittweite`: Klasse 3 (Raten, bp), Schranke `>= 1` und ganzzahlig
#   nach dem Gruppenkopf oben (technik.md T5, Erlaeuterung zu Klasse 10,
#   Aufzaehlungspunkt "Instrumentenstufe (10)", mit T51,
#   Folgerung). Keine obere aus specs/; wirksam wird sie bei
#   `instrument_max - instrument_min = 20.000` bp.
# Kalibriert: Selbstspieler (`schrittweite`).
# Scheitert daran: wie beim Zoll.
[instrument.haushalt]
schrittweite = 1  # PLATZHALTER
instrument_min = -10000  # PLATZHALTER
instrument_max = 10000  # PLATZHALTER

# Klasse 10 (Instrumentenstufe). Kapitalverkehrs- und
# Finanzmarktregulierung: **kein Datenanker, reines Modellkonstrukt**
# (spiel.md, T5 Klasse 10). Alle drei Werte legt T51 fest, keiner ist
# kalibrierbar:
#   `schrittweite`   = 1  ("hoechstens ein Schritt je Runde" heisst hier
#                          **eine Stufe**, T5 Klasse 10, T51)
#   `instrument_min` = 0  (Wertebereich `0 ... regulierung_stufen`, T51)
#   `instrument_max` = `regulierung_stufen` (ebd.)
# **`instrument_max` ist damit eine zweite Kopie von
# `regulierung_stufen`.** Das ist genau der Fehlertyp, den T45 fuer
# Adressen ausschliesst -- eine Groesse mit zwei Herren. Die Vorgabe
# erzeugt ihn, dieses Paket kann ihn nicht aufloesen (das waere eine
# Abweichung von specs/ und braeuchte einen ADR). Auflage an das Paket,
# das diese Datei einliest: **Gleichheit pruefen und bei Ungleichheit
# abbrechen**, nicht eine der beiden Zahlen bevorzugen. Als Befund
# vermerkt.
# Scheitert daran: Nichts -- hier ist nichts zu kalibrieren. Der Regler
#   dieses Instruments heisst `regulierung_stufen`.
[instrument.regulierung]
schrittweite = 1  # FEST (T51)
instrument_min = 0  # FEST (T51)
instrument_max = 1  # FEST (T51), muss `regulierung_stufen` gleichen


# =====================================================================
# BEFUNDE -- was ein Pruefer wissen muss, bevor er zaehlt
#
# 1. **25 der 50 Namen sind gebildet, nicht zitiert.** Woertlich in
#    specs/ stehen: stufenweite, stufen_max, ausstiegsabschlag,
#    zwangsabschlag, aufschlag, lobbykosten, beteiligungsrabatt,
#    gegenlobby_satz, druck_max, regulierung_stufen, schwelle_v,
#    schwelle_e, startkapital sowie schrittweite / instrument_min /
#    instrument_max in den vier Instrumententabellen (12 Schluessel).
#    Gebildet sind die uebrigen 25: startzustimmung, regulierung_start
#    (beide schon in Paket 0007 so gebildet und dort markiert),
#    aufsicht_schwelle_1/_2/_3, aufsicht_max, nachahmer_tempo,
#    nachahmer_max, anlegerabzug_anteil, die vier Verzoegerungen und die
#    zwoelf der Gruppe C.
#
# 2. **T27 nennt "Elastizitaeten", specs/ nennt keine einzige.** Die
#    zwoelf Schluessel der Gruppe C sind nach der oben genannten Regel
#    ausgewaehlt (benannte Wirkung, braucht eine Zahl, hat sonst kein
#    Zuhause). Ob es genau diese zwoelf sind, entscheidet erst das Paket,
#    das Schritt 3 bis 5 baut. Hier ist sowohl ein Regler zu viel als
#    auch einer zu wenig moeglich.
#
# 3. **`startkapital` bestimmt zwei Adressen** -- `fonds.kasse` und
#    `fonds.anlegerbestand` (spiel.md, T45; so auch im
#    Adressverzeichnis aus Paket 0007). Wer den Anlegerbestand vom
#    Startkapital trennen will, braucht einen ADR.
#
# 4. **`instrument_max[regulierung]` und `regulierung_stufen` sind
#    dieselbe Zahl** (T51). Auflage: Gleichheit beim Einlesen pruefen,
#    Ungleichheit ist ein Abbruch.
#
# 5. **Welche Platzhalter voneinander abhaengen -- vollstaendig, und
#    jede Bedingung nachgerechnet.**
#
#    Bis zum Ruecklauf 1 stand hier, `aufschlag` und
#    `instrument_min[leitzins]` seien "die einzige Stelle, an der zwei
#    Platzhalter voneinander abhaengen". Das war falsch, und der Satz
#    hat den Fehler gedeckt, den er haette finden sollen: Die Datei
#    rechnete genau das eine Paar nach, das sie fuer das einzige hielt,
#    und `startzustimmung = 0` neben `zustimmung_wechselschwelle = 0`
#    blieb unbemerkt. Deshalb steht hier jetzt die Aufzaehlung statt
#    einer Behauptung ueber sie.
#
#    **(a) Bedingungen zwischen zwei Schluesseln dieser Datei --
#    in dieser Datei nachrechenbar, hier nachgerechnet:**
#
#    | # | Bedingung | Herkunft | eingesetzt |
#    |---|---|---|---|
#    | 1 | `instrument_min[leitzins] >= 1 - aufschlag` | T51, T23 P5 | `-50 >= 1 - 51 = -50` ok |
#    | 2 | `1 <= aufsicht_schwelle_1 < _2 < _3 <= aufsicht_max` | Folgerung aus spiel.md Gegenkraft 1 | `1 <= 1 < 2 < 3 <= 3` ok |
#    | 3 | `0 <= regulierung_start <= regulierung_stufen` | T51 | `0 <= 0 <= 1` ok |
#    | 4 | `instrument_max[regulierung] = regulierung_stufen` | T51 | `1 = 1` ok |
#    | 5 | `startzustimmung > zustimmung_wechselschwelle` | Folgerung, spiel.md Gegenkraft 2 | `1 > 0` ok |
#    | 6 | `instrument_min <= instrument_max`, je Instrument | T51 (Wertebereich) | `-50 <= 10.000`; `0 <= 10.000`; `-10.000 <= 10.000`; `0 <= 1` ok |
#    | 7 | `lobbykosten * beteiligungsrabatt >= 1` (Nenner) | T50, T6 | `1 * 1 = 1` ok |
#    | 8 | `stufen_max * stufenweite <= 10.000` | Folgerung, keine Vorgabe aus specs/ | `1 * 1 = 1` ok |
#
#    Acht Bedingungen, 15 Einzelvergleiche, alle erfuellt. **Wer einen
#    der beteiligten Schluessel aendert, rechnet die Zeile neu, in der
#    er vorkommt.**
#
#    **(b) Der eine begrenzt nicht den anderen, sondern dessen
#    Ergebnis** -- eine Aenderung verletzt hier keine Schranke, sie
#    verschiebt die Wirkung:
#      * `gegenlobby_satz` -> Gegendruck, gekappt durch `druck_max`
#        (T5 Klasse 9): `0 <= 1`.
#      * `nachahmer_tempo` -> Nachahmerzaehler, gekappt durch
#        `nachahmer_max` (T5 Klasse 11): `0 <= 0`.
#      * `aufsicht_tempo` -> Aufsichtszaehler, gekappt durch
#        `aufsicht_max` (T5 Klasse 11): `0 <= 3`. **Nachgetragen in
#        Fassung 3** (Ruecklauf 2, Befund 2): Dieser vierte Fall fehlte,
#        obwohl der Abschnitt Vollstaendigkeit zusagt und obwohl er
#        Zeichen fuer Zeichen dieselbe Bauart hat wie der Fall darueber
#        -- beide Klasse 11, beide erhoehen einen Zaehler je Runde, beide
#        haben einen `_max`-Schluessel in dieser Datei. Kein Wert war
#        betroffen; falsch war die Zusage.
#      * `schrittweite` -> Stand, gekappt durch den Wertebereich
#        desselben Instruments (T51): `1` gegen die Spannen 10.050,
#        10.000, 20.000 und 1. Bei der Regulierung sind Weite und
#        Spanne gleich gross -- das ist die Vorgabe (eine Stufe, zwei
#        Staende), keine Enge dieser Datei.
#
#    **(c) Gekoppelt an eine Zahl, die nicht in dieser Datei steht** --
#    hier grundsaetzlich nicht nachrechenbar, und deshalb Auflage an den
#    Jahrgangsbau und nicht an den Pruefer dieser Datei:
#      * `startkapital` und `stufenweite` gegen den groessten und den
#        kleinsten der sechzehn Startmarktwerte (T47; die beiden Zahlen
#        weist das Manifest aus),
#      * `stufenweite` gegen die drei `aufsicht_schwelle_*`: erreichbare
#        Stufenzahlen muessen die Schwellen erreichen (T47),
#      * `aufschlag` gegen `min(leitzins_pfad)` des eingebetteten
#        Jahrgangs (T23 P5) -- der Platzhalter 51 haelt beide Kandidaten
#        des Pruefjahrgangs ein, ein anderer Jahrgang kann mehr
#        verlangen,
#      * `instrument_min`/`instrument_max` aller vier Instrumente gegen
#        den historischen Pfad (T51).
#
#    **(d) Gemeinsam kalibriert, aber ohne Ungleichung** -- kein
#    Paar dieser Sorte kann eine Schranke verletzen, sie sind hier nur
#    genannt, damit die Aufzaehlung vollstaendig ist: `schwelle_v` mit
#    `startkapital`; `lobbykosten` mit `startkapital` und `druck_max`;
#    `nachahmer_tempo`, `nachahmer_max` und `nachahmer_wirkung`;
#    `abschreibungsrate` mit `investitionsquote`; `startzustimmung`,
#    `zustimmung_wechselschwelle` und `zustimmung_elastizitaet`.
#
# 6. **`startzustimmung` und `regulierung_start` tragen je vier
#    Adressen** -- ein Wert fuer alle vier spielbaren Laender. So zaehlt
#    T45 (`4x2` von elf Parameteradressen). Ein Startwert je Land waere
