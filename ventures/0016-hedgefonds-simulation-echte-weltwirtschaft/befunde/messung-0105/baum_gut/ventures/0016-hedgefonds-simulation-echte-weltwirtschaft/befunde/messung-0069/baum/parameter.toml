#   `stufen_max >= 1` und `schrittweite >= 1`.
#   Herkunft ist der oben zitierte Satz selbst: Der Aufschlag *steigt*
#   mit der Sichtbarkeit. Zwei Fundstellen, beide ohne Zeilennummer
