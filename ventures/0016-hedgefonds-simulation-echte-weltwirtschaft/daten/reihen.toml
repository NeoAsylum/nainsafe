# Reihe 9 ist seit dem 2026-09-03 keine Sollreihe (Paket 0054); die
# T37-Klasse `gesetzt` entfaellt damit ersatzlos. `rolle_tabelle` oben
# bleibt der Wortlaut der Reihenliste und ist deshalb nicht mitgezogen
# -- siehe [[widerspruch]] Nr. 5.
sollreihen = 0
