exogen_ab = 1999
verkettet_ab = 0
lizenzurteil = "unklar"
lizenz_quelldatei = "daten/lizenzbefund-reihen.md"
lizenz_beleg_typ = "lizenztext"
t26_folge = "Kein benannter Fall von T26. Der allgemeine Satz gilt -- das Programm aendert sich nicht, nur das Manifest. Ein Ersatz ist nicht benannt; die Reihe haengt mit 11 und 12 an derselben IWF-Kette."
deckung_gemessen = true
deckung_urteil = "reisst -- DEU und CHN tragen in dieser Quelle keinen einzigen Wert, USA endet 2020"
offen = [
  "DISR ist kein einheitlicher Begriff ueber Laender hinweg: fuer die USA der Diskontsatz des Fed-Diskontfensters, fuer Brasilien der Rediskontsatz, und der ist nicht die Selic. Solange die Reihe eine Sollreihe war, hiess das: Sie misst im Rueckvergleich je Land etwas anderes. Seit dem 2026-09-03 ist sie keine Sollreihe mehr (Paket 0054), und die Frage wandert mit, statt zu verschwinden -- der Pfad wird im Weltlauf gesetzt, also entscheidet der Zinsbegriff, welche Eingabe die Maschine bekommt, und die Invariante prueft die Wiedergabe dieser Eingabe und nicht ihre Bedeutung. Entwurfsseitig ist die Sache entschieden; quellenseitig ist sie offen und liegt nach spiel.md, Offene Entwurfsfragen, beim Datenbauer -- zusammen mit der Beschaffung des Leitzinspfads fuer Deutschland und China, und beides ist ein eigenes Paket.",
  "Der IWF-Lizenztext ist nach fuenf Anlaeufen aus drei Rollen ungelesen (HTTP 403). An ihm haengen 11 der 27 Sollreihen und 7 der 16 Pruefgegenstaende. Bis zum 2026-09-03 waren es 15 der 31; mit der Sollrolle der Reihe 9 sind vier auf beiden Seiten weggefallen. Die 11 sind Reihe 8 (4) und Reihe 10 (3), die ueber den Drittanbieter IWF an derselben Erlaubnis haengen (siehe [[widerspruch]] Nr. 1), plus Reihe 11 (4) aus IMF.RES/WEO. Die 7 der 16 sind unveraendert: Es sind die vier Verbraucherpreise (Reihe 8) und die drei Wechselkurse (Reihe 10), und Reihe 9 war keiner der sechzehn.",
  "T23 Punkt 5 macht aus der ersten Stuetzstelle dieses Pfads die Jahrgangskonstante leitzins_start[l], vier Werte in Basispunkten. Faellt die Reihe, faellt auch sie.",
  "T51 und T23 Punkt 5: Der Jahrgangsbau rechnet aufschlag_min = 1 minus dem Minimum des Pfads und weist einen Parametersatz mit kleinerem aufschlag zurueck. Welche Reihe eingebettet wird, entscheidet die Schranke mit -- Einlagesatz oder Hauptrefinanzierungssatz geben verschiedene Werte.",
]

