begruendung = "Modelleinheit ist Tsd USD (T5 Klasse 2, konstante Preise des Basisjahrs). Welche Einheit und welches Basisjahr PWT 11.0 fuer den Kapitalstock fuehrt, hat keine der vier Befunddateien gemessen. Gemessen zu haben versucht es daten/einheitenbefund-pwt-baci.md: Abschnitt 3 fuer die Einheit, Abschnitt 4 fuer das Basisjahr. Dort steht auch, warum beide ohne Wert enden (PDF-Sperre) und was die Groessenordnung des Risikos ist -- stuende der Kapitalstock in Millionen USD, waere der Faktor nach Tsd USD 1000 und nicht 1. Ein Faktor 1 waere hier eine Behauptung, kein Befund."
