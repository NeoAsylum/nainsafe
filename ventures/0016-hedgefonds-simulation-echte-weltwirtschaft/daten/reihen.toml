####################################################################
# reihen.toml -- die Reihenliste, maschinenlesbar
#
# Paket 0017-reihenliste-maschinenlesbar, Datenbauer, Stand 2026-09-02.
#
# WAS DIESE DATEI IST
#
# Die Eingabetabelle des Jahrgangsbaus (T23). `werkzeuge/aufbereitung`
# liest sie und kann Fliesstext nicht lesen. Bis heute stand die
# Reihenliste an drei Orten in Prosa -- als Tabelle in `technik.md`
# Abschnitt 7, als Deckungsbefund in `daten/deckungsbefund-1997.md` und
# als zwei Lizenzbefunde in `daten/lizenzbefund-wdi.md` und
# `daten/lizenzbefund-reihen.md`. Diese Datei zieht die vier Orte
# zusammen, ohne einen davon zu aendern.
#
# WAS DIESE DATEI NICHT IST
#
# **Sie enthaelt keine Datenzeile.** Kein Messwert, kein Land-Jahr-Wert,
# nichts Heruntergeladenes. Sie beschreibt Reihen.
#
# **Sie entscheidet nichts.** Keine Reihe ist abgewaehlt, kein Fenster
# gewaehlt, kein Widerspruch aufgeloest. Beide Auswege aus T24 -- Reihe
# streichen oder Fenster kuerzen -- gehoeren dem Spielentwerfer. Wo zwei
# Quelldateien einander widersprechen, steht der Widerspruch unter
# `[[widerspruch]]` und nicht eine geglaettete Fassung.
#
# **Sie misst nicht nach.** Jedes Urteil in dieser Datei stammt aus
# einem der vier Befundpakete -- 0005, 0006, 0014 oder 0025 -- und
# traegt seine Herkunft im Feld `beleg`. 0025 ist mit Paket 0036
# hinzugekommen: Die gemessene Quelleneinheit der Reihe 14 stammt aus
# `daten/einheitenbefund-pwt-baci.md`, der vierten Befunddatei.
#
# LESEREGELN
#
# 1. `rolle_tabelle` und `t37_klasse` sind zwei verschiedene Dinge. Das
#    Wort `frei` in der Spalte "Rolle" der Reihenliste ist die
#    T37-Klasse und **kein Lizenzurteil**. Die Warnung davor stand am
#    2026-09-02 in `rueckstand.md` unter der Ueberschrift
#    (Zitat: Was der Geschäftsführer entscheiden lassen muss)
#    als eine von zwei Entwurfsfragen aus den Befunden der Vornacht;
#    in der vorliegenden Fassung jener Datei ist sie nicht mehr
#    aufgefuehrt. Das Lizenzurteil steht in `lizenzurteil` und
#    nirgends sonst.
# 2. `exogen_ab` und `verkettet_ab` sind Jahreszahlen. **0 heisst
#    leer.** Ein Jahrgang dieses Vorhabens beginnt fruehestens 1950
#    (PWT); eine 0 kann keine Jahreszahl sein. Die Umrechnung in eine
#    Runde nach T40 steht **nicht** hier -- R ist eine Groesse des
#    Jahrgangs.
# 3. Jede Reihe traegt je Umrechnungsschritt einen Block
#    `[[reihe.umrechnung]]`. Wo die Quelleneinheit in keiner der vier
#    Befunddateien gemessen ist, traegt der Block `art = "ungemessen"`
#    und **keinen** Faktor. Betroffen ist seit Paket 0036 noch eine
#    einzige Reihe: Reihe 3, der PWT-Kapitalstock. Sie nennt die
#    offene Frage in ihrem Feld `offen`.
#
#    `ungemessen` heisst dabei **vergeblich gemessen**, nicht
#    unversucht. Wo der Versuch steht und woran er gescheitert ist,
#    sagt `daten/einheitenbefund-pwt-baci.md`, Abschnitt 3 (Einheit)
#    und Abschnitt 4 (Basisjahr).
#
#    Die Regel unterscheidet dabei zwei Einsen, und dieser Unterschied
#    ist ihr ganzer Inhalt.
#
#    **Verboten bleibt die gesetzte Eins.** Sie behauptet, es sei
#    nichts umzurechnen, ohne dass jemand die Quelleneinheit gelesen
#    hat -- genau der stille Faktor, den das Paket verbietet. Deshalb
#    steht an einer ungemessenen Stelle `art = "ungemessen"` und kein
#    Faktor.
#
#    **Erlaubt ist die gemessene Eins.** Reihe 14 (BACI) traegt seit
#    Paket 0036 `art = "keine"`, `faktor = 1` und
#    `status = "gemessen"`, weil die Quelleneinheit im Wortlaut
#    gelesen ist -- die Beschreibungsseite nennt das Feld v "in
#    thousands current USD" -- und die Rechnung danebensteht:
#    Tausender gegen Tausender, also der Quotient Eins. Ausgerechnet,
#    nicht gesetzt.
#
#    Auseinanderzuhalten sind die beiden **nicht am Zahlenwert**,
#    sondern an den Feldern `status` und `beleg` des
#    Umrechnungsblocks. Eine gesetzte Eins hat dort nichts stehen.
#
#    Was die gemessene Eins nicht aufloest: Gemessen ist allein die
#    Groessenordnung. Die Preisbasis der Reihe 14 ist laufend und
#    steht gegen T5 Klasse 2 -- siehe `[[widerspruch]]` Nr. 9.
# 4. Woertliche Uebernahmen aus der Tabelle in `technik.md` Abschnitt 7
#    stehen in `bezeichnung`, `dimension`, `modelleinheit`,
#    `quelle_tabelle`, `rolle_tabelle` und `verdacht_tabelle`. Entfernt
#    ist allein die Fettauszeichnung (`**`); Backticks bleiben stehen,
#    weil sie in Reihe 2 und 16 Indikatorcodes und Groessennamen
#    abgrenzen.
# 5. T4 gilt auch hier: kein Dezimalpunkt in einem Zahlenwert. Wo eine
#    Quelle eine gebrochene Zahl nennt, steht sie skaliert und der
#    Skalenfaktor im Schluesselnamen (`..._mal_100000`).
#
# Quellen dieser Datei:
#   specs/0016-.../technik.md  T4, T5, T8, T23 (Punkte 1-10), T24, T25,
#                              T26, T27, T33, T37, T40, T45, T46, T51,
#                              Abschnitt 7
#   specs/0016-.../daten.md    Quellen und Lizenzen
#   daten/deckungsbefund-1997.md   (Paket 0006, Stand 2026-09-02)
#   daten/lizenzbefund-wdi.md      (Paket 0005, Stand 2026-09-01)
#   daten/lizenzbefund-reihen.md   (Paket 0014, Stand 2026-09-02)
#   daten/einheitenbefund-pwt-baci.md
#                                  (Paket 0025, Stand 2026-09-02)
####################################################################

[datei]
paket = "0017-reihenliste-maschinenlesbar"
rolle = "datenbauer"
stand = "2026-09-04"
paket_bedeutung = "Der Schluessel paket nennt das Paket des Erstuebertrags und nicht die letzte Aenderung. Wer wissen will, ob diese Datei aktuell ist, liest stand und nachgezogen_durch -- nicht paket."
nachgezogen_durch = [
  "0022-reihenliste-drei-korrekturen",
  "0032-reihentoml-notenbanken-nachziehen",
  "0036-reihentoml-baci-einheit-nachziehen",
  "0047-reihentoml-kopf-widerspruch-belegstellen",
  "0049-reihentoml-herkunft-und-selbstpruefung",
  "0057-reihentoml-belegstellen-ausserhalb-pruefweg",
  "0062-reihentoml-selbstmessung-und-rueckstandsverweise",
  "0065-reihentoml-reihe-9-ohne-sollrolle",
]
gegenstand = "Die 19 Reihen der Reihenliste aus technik.md Abschnitt 7"
reihen = 19
enthaelt_datenzeilen = false

# Der Stand der fuenf Vorlagen, gegen den diese Datei geschrieben ist.
# Aendert sich eine davon, ist diese Datei nachzuziehen -- sie ist eine
# Uebertragung, keine zweite Messung.
#
# Der Schluessel `einheiten` ist mit Paket 0049 dazugekommen. Er hat
# zwei Pakete lang gefehlt -- 0036, das den Beleg eintrug, und 0047 --,
# obwohl der Einheitenbefund seit Paket 0036 als `beleg` in dieser
# Datei steht; eine Vorlage, die hier nicht steht, wird nie
# nachgezogen.
#
# Beide Zahlwoerter sind mit Paket 0065 nachgezaehlt; vorher stand hier
# "vier Pakete" und "viermal als `beleg`", und beides war falsch.
# Gezaehlt ist so, damit es wiederholbar ist. Erstens: als `beleg`
# steht der Einheitenbefund **genau einmal** -- Blattwerte, deren
# Schluessel `beleg` heisst und die die Zeichenfolge
# einheitenbefund-pwt-baci enthalten, ergeben allein
# reihe.13.umrechnung.0.beleg, den ersten Umrechnungsblock der Reihe 14
# (die Liste `reihe` zaehlt ab null). Ueberhaupt genannt wird er in
# **acht** Blattwerten, `datei.vorlagen.einheiten` mitgezaehlt; die
# uebrigen sieben stehen unter `offen`, `begruendung` und `lang`.
# Zweitens: die zwei Pakete sind aus `nachgezogen_durch` gezaehlt --
# zwischen 0036, das den Beleg eintrug, und 0049, das diesen Schluessel
# nachtrug, liegt genau ein weiteres Paket, 0047; die Luecke bestand
# also waehrend 0036 und 0047. Gegengeprueft an den Fassungen dieser
# Datei im Git: der Beleg steht seit dem Commit ae6f605 (2026-09-03,
# die Aenderung des Pakets 0036), der Vorlagenschluessel seit 58908fa.
#
# Sie traegt den groessten offenen
# Rest der fuenf: Ihr Abschnitt 3 und ihr Abschnitt 4 messen Einheit
# und Basisjahr des PWT-Kapitalstocks vergeblich, und ihre Angabe zur
# BACI-Fassung 202601 ist nicht im Wortlaut der Freigabemitteilung
# gelesen. Wird eines davon geschlossen, betrifft es Reihe 3
# beziehungsweise Reihe 14.
[datei.vorlagen]
reihenliste = "specs/0016-hedgefonds-simulation-echte-weltwirtschaft/technik.md, Abschnitt 7"
deckung = "ventures/0016-hedgefonds-simulation-echte-weltwirtschaft/daten/deckungsbefund-1997.md, Stand 2026-09-02"
lizenz_wdi = "ventures/0016-hedgefonds-simulation-echte-weltwirtschaft/daten/lizenzbefund-wdi.md, Stand 2026-09-01"
lizenz_reihen = "ventures/0016-hedgefonds-simulation-echte-weltwirtschaft/daten/lizenzbefund-reihen.md, Stand 2026-09-02"
einheiten = "ventures/0016-hedgefonds-simulation-echte-weltwirtschaft/daten/einheitenbefund-pwt-baci.md, Stand 2026-09-02"


####################################################################
# ZAEHLUNG -- damit die Summen maschinell nachrechenbar sind und nicht
# geglaubt werden muessen. Wer diese Datei prueft, addiert `sollreihen`
# ueber alle `[[reihe]]` und vergleicht mit `sollreihen_gesamt`.
####################################################################

[zaehlung]
sollreihen_gesamt = 27
sollreihen_frei = 23
sollreihen_gesetzt = 0
sollreihen_abgeleitet = 4
frei_zerlegung = "Reihe 1 (4) + Reihe 2 (12) + Reihe 8 (4) + Reihe 10 (3) = 23"
# Die Klasse `gesetzt` ist seit dem 2026-09-03 leer und entfaellt:
# Reihe 9 (Leitzins) hat mit Paket 0054 ihre Sollrolle verloren und
# behaelt Start und Politikpfad. Der Grund ist keiner der Deckung --
# eine Reihe, die im Weltlauf als Eingabe gesetzt wird, hat den Fehler
# null per Konstruktion, kann nicht durchfallen und hat das Fenster
# trotzdem um ein Jahr gekuerzt. An ihre Stelle tritt eine Invariante
# statt eines Fehlermasses. Der Schluessel bleibt mit leerem Wert
# stehen und faellt nicht weg, damit die Probe drei Summanden behaelt
# und ein Nachziehen von einem Uebersehen zu unterscheiden ist.
gesetzt_zerlegung = ""
abgeleitet_zerlegung = "Reihe 11 (4)"
probe = "23 + 0 + 4 = 27, kurz 23 + 4 = 27"
beleg = "technik.md T37 und Abschnitt 7 (T23 Punkt 2), fuer den Schnitt vom 2026-09-03 spiel.md. Die 27 Sollreihen verteilen sich auf die Reihen 1, 2, 8, 10 und 11 -- Reihennummern dieser Datei, keine Dateizeilen. Bis zum 2026-09-03 waren es 31 ueber die Reihen 1, 2, 8, 9, 10 und 11; Reihe 9 hat ihre Sollrolle mit Paket 0054 verloren (spiel.md, Abschnitt zur Partielaenge R und Absatz Der Leitzins ist seit dem 2026-09-03 keine Sollreihe). Der erste Beleg traegt die Zahl 27 damit nur noch zur Haelfte: technik.md ist auf den Schnitt nicht nachgezogen und fuehrt in Abschnitt 7 und in T37 weiter 31 -- siehe [[widerspruch]] Nr. 5."

# Der Handelsblock zaehlt getrennt und **nicht** in den Sollreihen. Er
# ist die einzige Nicht-Sollreihe mit T37-Klasse; das ist so gewollt
# und kein Fehler der Zaehlung. Der Schluesselname trug bis zum
# 2026-09-04 die Zahl 31 mit (`in_den_31_enthalten`); er heisst seither
# `in_den_sollreihen_enthalten` und ueberlebt damit jede weitere
# Aenderung an der Sollreihenzahl. Reihe 9 ist seit dem 2026-09-03
# ebenfalls keine Sollreihe mehr, traegt aber auch keine T37-Klasse
# (`t37_klasse` leer) und ist deshalb kein zweiter Fall.
[zaehlung.handelsblock]
reihe = 14
stroeme = 40
t37_klasse = "frei"
in_den_sollreihen_enthalten = false

# T37 rechnet nicht in Reihen, sondern in Pruefgegenstaenden. Die Zahl
# steht hier, weil jede Lizenzfrage ueber sie ihren Preis bekommt.
#
# **Dieser Block bleibt vom Schnitt vom 2026-09-03 unberuehrt**, und
# das ist begruendet und nicht bloss beobachtbar: `gesamt` bleibt 16,
# `toleranz` bleibt 2. Reihe 9 trug nach T37 die Klasse `gesetzt` und
# kommt in keinem der sechzehn Pruefgegenstaende vor -- die
# Aufzaehlung darunter ist abschliessend und fuehrt BIP je Land (4),
# Sektorstruktur je Land (4), Verbraucherpreise je Land (4),
# Wechselkurs je Land ausser den USA (3) und den Handelsblock (1). Der
# Leitzins steht in keiner dieser fuenf Zeilen. 4 + 4 + 4 + 3 + 1 = 16
# ergibt sich mit und ohne Reihe 9. Es ist die einzige Zahl dieser
# Datei, die der Schnitt nicht bewegt; wer sie mitwandern laesst, hat
# die Entscheidung falsch gelesen.
[zaehlung.pruefgegenstaende]
gesamt = 16
bip_je_land = 4
sektorstruktur_je_land = 4
verbraucherpreise_je_land = 4
wechselkurs_je_land_ausser_usa = 3
handelsblock = 1
toleranz = 2
beleg = "technik.md T37"

# Lizenzstand der 27 Sollreihen, aus 0005 und 0014 fortgeschrieben.
# Bis zum 2026-09-03 waren es 31; Reihe 9 (4, unklar) ist mit Paket
# 0054 aus den Sollreihen ausgeschieden. Die sieben freien und die
# null gesperrten bleiben davon unberuehrt, weil Reihe 9 unklar war.
[zaehlung.lizenz]
sollreihen_frei = 7
sollreihen_unklar = 20
sollreihen_gesperrt = 0
frei_zerlegung = "Reihe 8 (4) + Reihe 10 (3) = 7, beide aus Paket 0005"
unklar_zerlegung = "Reihe 1 (4) + Reihe 2 (12) + Reihe 11 (4) = 20"
beleg = "daten/lizenzbefund-reihen.md, Abschnitt 5"
gegenrechnung = '''Die sieben freien Sollreihen haengen an der IWF-Erlaubnis, deren Volltext niemand lesen konnte und in deren Definitionssatz nach Abschnitt 3 von lizenzbefund-reihen.md ein Vorbehalt steht. Nimmt man die Regel "Suchauszug genuegt nicht" auch dort ernst, lautet die Zeile: frei 0, unklar 27, gesperrt 0. Beide Zahlen stehen nebeneinander; diese Datei loest den Widerspruch nicht auf (siehe [[widerspruch]] Nr. 1).'''


