  "T23 Punkt 1 teilt den Kapitalstock ueber die auf 10.000 normierten Sektoranteile aus Reihe 2 auf drei Sektoren je Gebiet auf (Herkunftseintrag 'Datenanker(3 x 2)'). Die Reihe haengt damit an der Lizenzlage von Reihe 2 mit.",
  "Kein Indikatorcode festgeschrieben.",
