####################################################################
# WIDERSPRUECHE -- Stellen, an denen zwei Quelldateien nicht dasselbe
# sagen. Sie stehen hier als Widerspruch und nicht aufgeloest; ein
# Zusammenzug, der zwei Aussagen glaettet, ist genau der Fehler, an dem
# Paket 0006 zurueckging.
####################################################################

[[widerspruch]]
nr = 1
betrifft_reihen = [8, 10]
kurz = "0005 urteilt frei, 0014 entzieht dem Urteil die Grundlage"
lang = '''lizenzbefund-wdi.md (Paket 0005) urteilt zu Reihe 8 und 10 `frei`, weil der genannte Drittanbieter der IWF ist und dessen Bedingungen das Verkaufen erlauben. lizenzbefund-reihen.md (Paket 0014) haelt fest, dass genau dieser IWF-Text nach fuenf Anlaeufen aus drei Rollen ungelesen ist (HTTP 403) und dass ein Suchauszug einen Vorbehalt im Definitionssatz des Wortes "Data" andeutet. 0014 rechnet die beiden Reihen trotzdem weiter als `frei`, weil sie nicht sein Paket sind, und stellt die Gegenrechnung daneben.'''
in_dieser_datei = "Uebertragen ist das Urteil `frei` aus 0005; die Gegenrechnung steht in [zaehlung.lizenz].gegenrechnung und im Feld `offen` beider Reihen."
entscheidet = "Betreiber -- ein einziger Seitenabruf auf imf.org/en/about/copyright-and-terms im Volltext"

[[widerspruch]]
nr = 2
betrifft_reihen = [1, 2, 5, 6, 7, 8, 10, 13]
kurz = "Die Spalte Verdacht der Reihenliste haelt bei keiner gemessenen Reihe"
lang = '''Zwoelf WDI-Codes ueber acht Reihen sind in 0005 und 0014 gemessen worden. Rechenweg: lizenzbefund-wdi.md, Abschnitt Die vier Reihen im Überblick (Tabelle, beginnend mit der Kopfzeile | Nr | Größe | Indikatorcode |), fuehrt vier Reihen mit zusammen sechs Codes (Reihe 13: TM.TAX.MRCH.WM.AR.ZS; Reihe 7: SL.AGR.EMPL.ZS, SL.IND.EMPL.ZS, SL.SRV.EMPL.ZS; Reihe 8: FP.CPI.TOTL.ZG; Reihe 10: PA.NUS.FCRF); lizenzbefund-reihen.md, Frontmatter, Zeichenfolge codes_abgerufen_reihen: 6, fuehrt sechs weitere ueber vier Reihen (Reihe 1: NY.GDP.MKTP.KD; Reihe 2: NV.AGR.TOTL.ZS, NV.IND.TOTL.ZS, NV.SRV.TOTL.ZS; Reihe 5: SP.POP.TOTL; Reihe 6: SL.TLF.TOTL.IN). 6 + 6 = 12 Codes ueber 4 + 4 = 8 Reihen. Alle zwoelf nennen im Feld "Source" mindestens einen Bestand ausserhalb der Weltbank -- auch die sechs aus 0014, die die Spalte "Verdacht" mit "nein" fuehrt (lizenzbefund-reihen.md, erster Absatz unter der Ueberschrift Kein Fund ist gesperrt, mit der Zeichenfolge nennen im Feld `Source` mindestens einen). Nicht mitgezaehlt sind die zwei Gegenprobecodes aus lizenzbefund-reihen.md, Frontmatter, Zeichenfolge codes_abgerufen_gegenprobe: 2 (SL.EMP.TOTL.SP.ZS, IQ.CPA.ECON.XQ): sie tragen dort ausdruecklich kein Urteil und keine volle Abruf-URL. Einer davon, die Kontrollreihe IQ.CPA.ECON.XQ, zeigt, dass es Reihen ohne Fremdbestand gibt -- nur keine, die dieses Modell braucht. Die Spalte trennt nichts. Zum Feld betrifft_reihen: es fuehrt genau diese acht Reihen aufsteigend (1, 2, 5, 6, 7, 8, 10, 13). Korrektur vom 2026-09-02: Hier stand "Zehn", und betrifft_reihen liess Reihe 7 aus. Die Zehn entsteht, wenn man "sechs Codes" aus 0014 und "vier Reihen" aus 0005 addiert -- lizenzbefund-reihen.md, Befund 1 an den Architekten, Zeichenfolge Zusammen mit den vier Reihen aus 0005 ist damit, sagt an der entsprechenden Stelle richtig "Alle sechs gemessenen Codes ... zusammen mit den vier Reihen aus 0005". Reihe 7 fehlte, obwohl sie in 0005 gemessen ist und im Feld "Source" die ILO nennt (lizenzbefund-wdi.md, Abschnitt Die vier Reihen im Überblick, Tabellenzeile zu Reihe 7: sie beginnt mit | 7 | Beschäftigung je Sektor | und fuehrt | ILOEST (ILO) | als Drittanbieter), und obwohl dieser Block behauptet, die Spalte halte bei keiner gemessenen Reihe.'''
in_dieser_datei = "Das Feld `verdacht_tabelle` traegt den Wortlaut der Spalte; das Feld `lizenzurteil` traegt die Messung. Wo beide auseinandergehen, gilt fuer den Jahrgangsbau `lizenzurteil`."
entscheidet = "Architekt (Befund 1 aus lizenzbefund-reihen.md)"

[[widerspruch]]
nr = 3
betrifft_reihen = [2]
kurz = "Reihe 2 zerfaellt in zwei Lizenzlagen, die Reihenliste fuehrt sie als eine"
lang = '''`NV.AGR.TOTL.ZS` nennt im Feld `Source` die OECD, `NV.IND.TOTL.ZS` und `NV.SRV.TOTL.ZS` nennen sie nicht -- dort stehen nationale Statistikaemter und Notenbanken. Die Zeile "Start + Soll (12, frei, 8 unabhaengig)" fasst damit zwei verschiedene Lizenzlagen zusammen. Fuer T37 ist das folgenlos (die Alle-drei-Bedingung macht die Gruppe unteilbar), fuer die Klaerungskosten nicht.'''
in_dieser_datei = "Reihe 2 traegt zwei Blocks [[reihe.lizenzbeleg]] -- einen fuer 2a, einen fuer 2b und 2c."
entscheidet = "Architekt (Befund 2 aus lizenzbefund-reihen.md)"

[[widerspruch]]
nr = 4
betrifft_reihen = [10]
kurz = "Faktor 10.000 auf den Rohkurs gegen T5 Klasse 6 (Startjahr = 10.000)"
lang = '''Das Arbeitspaket gibt fuer Reihe 10 den Faktor 10.000 vor und begruendet ihn mit technik.md T46, Tabellenzeile `land.US.wechselkurs` (Zitat: 'Reihe 10 trägt drei Länder, die USA definitionsgemäß nicht'; dort steht der Startwert 10.000, der Numeraire): aus 1,73405583 DEM/USD wird 17.341. T5 Klasse 6 beschreibt dieselbe Groesse dagegen als "Index gegen USD, Startjahr = 10.000" -- danach traegt Deutschland im Startjahr 10.000 und nicht 17.341. Beide Lesarten geben fuer die USA 10.000 und gehen fuer die drei uebrigen Laender auseinander.'''
in_dieser_datei = "Eingetragen ist der vom Arbeitspaket verlangte Faktor 10.000 (ein Eintrag mit 1 waere nach der Abnahme ein Befund). Die Frage nach der Basierung steht im Feld `offen` der Reihe 10."
entscheidet = "Architekt -- eine Zeile in T5 Klasse 6 oder in T23"

[[widerspruch]]
nr = 5
betrifft_reihen = [9]
kurz = "Die Reihenliste nennt IWF IFS; IFS gibt es nicht mehr"
lang = '''Der alte IFS-Zugang ist tot (DNS-Fehler), der neue fuehrt keinen Datenfluss namens IFS. Eingebettet wird nach 0006 `IMF.STA/MFS_IR` 9.0.0, Code `DISR_RT_PT_A_PT` (Diskontsatz). Dieser Code misst je Land eine andere Groesse -- fuer die USA den Diskontsatz des Fed-Diskontfensters, fuer Brasilien den Rediskontsatz, der nicht die Selic ist -- und fuehrt Deutschland und China ueberhaupt nicht.'''
in_dieser_datei = "quelle_eingebettet nennt den Nachfolgefluss, quelle_tabelle den Wortlaut der Reihenliste. Die Deckungsluecke steht in [[reihe.deckung]]. Seit Paket 0065 traegt Reihe 9 rolle = [start, politikpfad] ohne soll, sollreihen = 0 und ein leeres t37_klasse. Nicht mitgezogen ist rolle_tabelle: Das Feld traegt nach Leseregel 4 den Wortlaut der Reihenliste aus technik.md Abschnitt 7, und die Reihenliste sagt dort in Zeile 1441 weiter Start + Politikpfad + Soll (4, gesetzt); ebenso fuehrt die Klassentabelle in T37 die Zeile gesetzt mit dem Leitzins (4). Dieses Feld umzuschreiben hiesse, einen Wortlaut zu behaupten, den die Vorlage nicht traegt -- dann stuende dort Start + Politikpfad und waere von einer echten Uebernahme nicht zu unterscheiden. Der Widerspruch steht deshalb hier statt geglaettet in der Reihe, und er faellt weg, sobald technik.md nachgezogen ist; das ist ein eigenes Paket und gehoert dem Architekten. Fuer den Jahrgangsbau gelten rolle, sollreihen und t37_klasse und nicht rolle_tabelle -- dieselbe Vorfahrt wie in Widerspruch Nr. 2."
entscheidet = "Teilweise entschieden -- was offen blieb, hat den Adressaten gewechselt. Entschieden am 2026-09-03 vom Spielentwerfer, Paket 0054: Reihe 9 verliert ihre Sollrolle und behaelt Start und Politikpfad; an die Stelle eines Fehlermasses tritt eine Invariante (spiel.md, Absatz Der Leitzins ist seit dem 2026-09-03 keine Sollreihe). Die Reihe ist damit weder gestrichen noch ihre Quelle ersetzt. Offen bleibt die Quelle fuer den Politikpfad: DISR fuehrt Deutschland und China nicht, und ob ein einheitlicher Zinsbegriff ueber die vier Laender erreichbar ist, ist ungemessen. Das entscheidet nach spiel.md, Offene Entwurfsfragen, nicht mehr der Spielentwerfer, sondern der Datenbauer in einem eigenen Paket. Drittens offen und an den Architekten: technik.md fuehrt Reihe 9 in Abschnitt 7 und in T37 weiter als Sollreihe der Klasse gesetzt; siehe in_dieser_datei. Die Sache stand am 2026-09-02 in rueckstand.md unter der Ueberschrift (Zitat: Was der Geschäftsführer entscheiden lassen muss) als eigener Punkt (Zitat: Reihe 9 und R = 19); in der vorliegenden Fassung jener Datei ist sie nicht mehr aufgefuehrt."

[[widerspruch]]
nr = 6
betrifft_reihen = [6]
kurz = "Der gewaehlte Code liefert Erwerbspersonen, die Reihenliste verlangt Erwerbstaetige"
lang = '''`SL.TLF.TOTL.IN` heisst "Labor force, total" und umfasst Erwerbstaetige **und** Erwerbslose. Der Code, der Erwerbstaetige liefert, waere `SL.EMP.TOTL.SP.ZS` mal Bevoelkerung -- eine andere Groesse und eine andere Rechnung. Fuer das Lizenzurteil ist es gleich (beide ILO), fuer den Jahrgangsbau nicht. Der Code steht nirgends in specs/; er ist in 0014 gewaehlt worden.'''
in_dieser_datei = "code_herkunft = 'gewaehlt-0014'; die Frage steht im Feld `offen` der Reihe 6."
entscheidet = "Architekt (Befund 3 aus lizenzbefund-reihen.md)"

[[widerspruch]]
nr = 7
betrifft_reihen = [17, 18, 19]
kurz = "Drei Reihen ohne Quelle tragen ein Lizenzurteil, das keine Befunddatei belegt"
lang = '''Die Abnahme verlangt "keine Reihe ohne Urteil" und zugleich "kein Urteil ohne Beleg" aus einer der drei Lizenz- und Deckungsbefunddateien. Die Reihen 17, 18 und 19 fuehren in der Reihenliste die Quelle "keine"; keine der drei Lizenz- und Deckungsbefunddateien behandelt sie, weil es an ihnen nichts zu pruefen gibt. Eingetragen ist `frei` mit dem Beleg der Reihenliste selbst und dem Vermerk `lizenz_beleg_typ = "ohne_fremdbestand"`.'''
in_dieser_datei = "Sichtbar gemacht statt stillschweigend gefuellt. Wer die Abnahme streng liest, kann das als Befund fuehren; die Alternative -- `unklar` -- waere die falschere Aussage, denn an einer Groesse ohne Quelle ist nichts unklar."
entscheidet = "Pruefer dieses Pakets"

[[widerspruch]]
nr = 8
betrifft_reihen = [16]
kurz = "Reihe 16 hat kein eigenes Lizenzurteil in einer Befunddatei"
lang = '''`durchgriff` wird nach T23 Punkt 5 aus H (BACI, Reihe 14, Urteil `frei`) und N (WDI-Wertschoepfung, Reihe 2, Urteil `unklar`) gerechnet. Weder 0005 noch 0014 urteilt ueber Reihe 16.'''
in_dieser_datei = "Eingetragen ist `unklar` mit der ausdruecklichen Angabe, dass das Urteil von Reihe 2 geerbt und nicht gemessen ist. Ob eine abgeleitete Groesse das schwaechere Urteil ihrer Eingaben erbt, entscheidet nicht diese Datei."
entscheidet = "Betreiber beziehungsweise Datenkurator"

[[widerspruch]]
nr = 9
betrifft_reihen = [14, 16]
kurz = "BACI meldet laufende Preise, T5 Klasse 2 verlangt konstante"
lang = '''Gemessen am 2026-09-02 am Wortlaut der Beschreibungsseite von BACI: Das Feld v traegt dort "Value of the trade flow (in thousands current USD)". T5 Klasse 2 verlangt fuer volkswirtschaftliche Betraege -- und der Handelsstrom steht dort namentlich -- "Tausend USD zu konstanten Preisen des Basisjahrs". Die Modellseite ist damit real, die Sollseite nominal. Das ist keine Rundungsfrage: Reihe 14 traegt 40 Handelsstroeme, T42 rechnet ueber jeden einzelnen den MAPE gegen die Schwelle 2.000 (also 20 Prozent), T37 fuehrt den Handelsblock unter den sechzehn Pruefgegenstaenden, und ueber das Fenster 1997 bis 2021 misst der Rueckvergleich fuer diesen Block die Preisentwicklung mit. Ueber Reihe 16 wirkt derselbe Widerspruch weiter: H kommt aus BACI in laufenden Preisen, N ueber Reihe 1 aus der Weltbank in konstanten Preisen von 2015, und der Quotient traegt deshalb einen Preisanteil -- unter der Annahme steigender Preise faellt durchgriff fuer Jahre nach 2015 zu hoch und davor zu niedrig aus. daten/einheitenbefund-pwt-baci.md, Abschnitt 5, zaehlt vier Moeglichkeiten auf und waehlt keine. Erstens deflationieren: ein Deflatorschritt kommt in die Umrechnung der Reihe 14; offen daran ist, welcher Deflator aus welcher Quelle zu welchem Basisjahr -- keine der vier geprueften Quellen ist darauf gemessen, und eine fuenfte waere ein Fall fuer den Datenkurator. Zweitens die Klasse aendern: Reihe 14 verlaesst Klasse 2, oder Klasse 2 bekommt fuer nominale Handelsstroeme eine ausgewiesene Ausnahme in der Tabelle selbst; dann muesste die Modellgroesse Handelsstrom nominal gefuehrt werden, was Korbwert und Bewertung mittragen. Drittens die Vergleichbarkeit aufgeben und benennen: Sollreihe nominal, Modell real, und der Rueckvergleich weist fuer den Handelsblock aus, dass sein Fehlermass einen Preisanteil enthaelt; dann gehoert er entweder aus der Zaehlung der sechzehn heraus oder mit eigener Schwelle hinein. Viertens die Quelle wechseln: der IWF DOTS steht als Rueckfall, T26 laesst ihn nur fuer Spieljahrgaenge vor 1997 zu, und seine Preisbasis ist ebenfalls ungemessen -- dieser Weg tauscht eine gemessene Schwierigkeit gegen eine ungemessene. Diese Datei waehlt keine der vier.'''
in_dieser_datei = "Eingetragen ist im Umrechnungsblock der Reihe 14 der Faktor 1 -- gemessen und nicht gesetzt, der Unterschied steht in Leseregel 3 im Kopf. Gemessen ist damit allein die Groessenordnung: Tausender gegen Tausender. Die Preisbasis ist nicht aufgeloest, und dieser Eintrag ist die Stelle, an der das in der Widerspruchsliste steht; ausserdem im ersten Eintrag des Feldes `offen` der Reihe 14 und im ersten Eintrag des Feldes `offen` der Reihe 16. Bis zum 2026-09-03 stand er allein dort -- der Kopf dieser Datei verlangt aber, dass ein Widerspruch zwischen zwei Quelldateien unter `[[widerspruch]]` steht."
entscheidet = "Architekt -- ein Deflatorschritt in der Umrechnung der Reihe 14 oder eine Festlegung in T5 Klasse 2 beziehungsweise T23"


