####################################################################
# PRUEFWEG -- wie diese Datei nachzuzaehlen ist, damit der Pruefer
# nicht selbst eine Zaehlregel erfinden muss.
####################################################################

[pruefweg]
toml_geprueft = "ja -- am 2026-09-03 maschinell eingelesen. Herkunft der Messung: die Pruefung des Pakets 0036, befunde/pruefung-0036-reihentoml-baci-einheit-nachziehen-2026-09-03.md, Befund 2. Dort ist der Parserlauf zum ersten Mal gelaufen; dieses Feld traegt sein Ergebnis nach und misst nicht selbst. Werkzeug: Python 3.14.4, tomllib.load im Binaermodus ueber diese Datei. Ergebnis: gueltiges TOML 1.0; die Liste reihe hat 19 Eintraege; zweimal eingelesen ergibt dieselbe Struktur, der Vergleich der beiden Einlesungen ist wahr, der Lauf ist insoweit wiederholbar; die Summe des Schluessels sollreihen ueber die 19 Reihenbloecke ist 31 und damit gleich zaehlung.sollreihen_gesamt. Die Wurzel fuehrt sechs Tabellen (datei, namensnennung, pruefweg, reihe, widerspruch, zaehlung), die Liste widerspruch 9 Eintraege. Damit sind schnitt_6 und die von toml_geprueft_grenze beschriebene Grammatikluecke geschlossen: TOML 1.0 verbietet den doppelten Schluessel innerhalb einer Tabelle, tomllib bricht darauf mit TOMLDecodeError: Cannot overwrite a value ab -- an einem Miniaturbeispiel gegengeprueft --, und diese Datei liest fehlerfrei ein, enthaelt also keinen. Dasselbe gilt fuer die beiden anderen Faelle aus toml_geprueft_grenze, ungueltiger Schluesselname und falsch verschachtelte Tabelle. Die Messung von 0036 galt der Fassung vor den Aenderungen der Pakete 0047 und 0049; gegen die hier vorliegende Fassung ist sie am 2026-09-03 im Baulauf des Pakets 0049 mit demselben Werkzeug und demselben Ergebnis wiederholt worden. Zur Werkzeuglage, damit der Stand nicht ueberrascht: Die Werkzeugliste der Rolle datenbauer fuehrt kein Werkzeug, das Code ausfuehrt -- der Schluessel tools im Frontmatter von agents/rollen/datenbauer.md nennt Read, Glob, Grep, WebSearch, WebFetch, Edit(ventures/**) und Edit(notizen/datenbauer.md). Ein Lauf dieser Rolle kann den Parserlauf aus eigener Ausstattung also nicht erzwingen; welche Werkzeuge ein Lauf wirklich bekommt, wechselt von Lauf zu Lauf. Bis zum 2026-09-03 stand hier nein, begruendet damit, ein TOML-Leser laufe in dieser Umgebung nicht und der python3-Aufruf werde abgewiesen. Abgewiesen wurden einzelne Aufrufe; die Verallgemeinerung auf die Umgebung war falsch. Bis zum 2026-09-02 stand hier ausserdem die Behauptung, die Datei sei mit tomllib eingelesen worden; das war zu jenem Zeitpunkt nicht geschehen. Die sieben Schnitte schnitt_1 bis schnitt_7 bleiben unabhaengig davon stehen: Jeder nennt sein Muster und sein Ergebnis, jeder ist mit dem Werkzeug Grep wiederholbar, und jeder ist am 2026-09-03 gegen genau diese Fassung der Datei gelaufen. Nachtrag vom 2026-09-04, Baulauf des Pakets 0057: Dieses Paket hat neun Werte geaendert (zaehlung.beleg, die Felder lang der Widersprueche Nr. 2 und Nr. 4, begruendung und beleg des zweiten Umrechnungsblocks der Reihe 2, wortlaut_form der Reihen 6 und 13, begruendung und beleg des ersten Umrechnungsblocks der Reihe 10). Der Parserlauf und die sieben Schnitte sind danach mit demselben Werkzeug gegen die vorliegende Fassung wiederholt worden, mit unveraenderten Ergebnissen; zusaetzlich sind alte und neue Fassung Schluessel fuer Schluessel verglichen worden -- gleiche Schluesselmenge, 1212 Blattwerte, genau die neun genannten verschieden. Nachtrag vom 2026-09-04, Baulauf des Pakets 0062: Der vorstehende Halbsatz ist in allen drei Angaben falsch. Er bleibt stehen, weil er zeigt, woran dieses Feld zum dritten Mal gescheitert ist -- eine Messung ohne genannten Bezugsstand, geschrieben vor der letzten Aenderung an der Datei, die sie misst. Es gilt die folgende Messung. Bezugsstand ist der Commit 1a4d240, die Fassung vor dem Baulauf des Pakets 0057; verglichen wird gegen die hier vorliegende Fassung, und die Messung ist nach der letzten Schreibbewegung des Pakets 0062 an dieser Datei wiederholt worden. Werkzeug wie oben: tomllib, beide Baeume flach gezogen, Blattschluessel gezaehlt. Der Bezugsstand traegt 1212 Blattwerte, die vorliegende Fassung 1214. Die Schluesselmengen sind also nicht gleich: zwei Schluessel sind neu, datei.nachgezogen_durch.5 und datei.nachgezogen_durch.6 mit den Kennungen der Pakete 0057 und 0062, und keiner ist weggefallen. Von den 1212 gemeinsamen Schluesseln tragen 13 verschiedene Werte: die neun oben genannten, dazu datei.stand und dieses Feld selbst, dazu widerspruch.4.entscheidet und reihe.1.offen.0, die erst das Paket 0062 geaendert hat (Zaehlung ab null, also Widerspruch Nr. 5 und Reihe 2). Der dritte vom Paket 0062 berichtigte Verweis steht in reihe.1.umrechnung.1.beleg und damit schon unter den neun; der vierte steht im Kopfkommentar und ist kein Blattwert. Nachtrag vom 2026-09-04, Baulauf des Pakets 0065: Bezugsstand ist der Commit 4eb20ac, dessen Fassung dieser Datei mit dem Arbeitsbaum vor dem Lauf zeichengleich war (git hash-object 7a83aef58053050b77ae502c27b9aba24e97f77d); verglichen wird gegen die hier vorliegende Fassung, und die Messung ist nach der letzten Schreibbewegung des Pakets 0065 an dieser Datei wiederholt worden. Werkzeug wie oben: Python 3, tomllib.load im Binaermodus, beide Baeume flach gezogen, Blattschluessel gezaehlt. Ergebnis des Parserlaufs gegen die vorliegende Fassung: gueltiges TOML 1.0; die Liste reihe hat 19 Eintraege, die Liste widerspruch 9, die Wurzel fuehrt sechs Tabellen; die Summe des Schluessels sollreihen ueber die 19 Reihenbloecke ist 27 und damit gleich zaehlung.sollreihen_gesamt. Der Bezugsstand traegt 1214 Blattwerte, die vorliegende Fassung ebenfalls 1214 -- die Zahl ist gleich, die Schluesselmenge nicht: neu sind datei.nachgezogen_durch.7 mit der Kennung dieses Pakets und zaehlung.handelsblock.in_den_sollreihen_enthalten; weggefallen sind reihe.8.rolle.2, der Eintrag soll der Reihe 9 (die Liste reihe zaehlt ab null), und zaehlung.handelsblock.in_den_31_enthalten, der umbenannte Vorgaenger. Von den 1212 gemeinsamen Schluesseln tragen 20 verschiedene Werte: zaehlung.sollreihen_gesamt, zaehlung.sollreihen_gesetzt, zaehlung.gesetzt_zerlegung, zaehlung.probe, zaehlung.beleg, zaehlung.lizenz.sollreihen_unklar, zaehlung.lizenz.unklar_zerlegung, zaehlung.lizenz.gegenrechnung, reihe.8.sollreihen, reihe.8.t37_klasse, reihe.8.offen.0, reihe.8.offen.1, widerspruch.4.entscheidet und widerspruch.4.in_dieser_datei (das ist Widerspruch Nr. 5; die Liste widerspruch zaehlt ab null), pruefweg.schnitt_5, pruefweg.zaehlregel_sollreihen, pruefweg.zaehlregel_t37, pruefweg.handelsblock, pruefweg.falle und dieses Feld selbst. Was diese Bilanz nicht zeigt und deshalb hier steht: Kommentare sind keine Blattwerte. Das Paket hat ausserdem fuenf Kommentarstellen geaendert -- den Kommentar ueber [datei.vorlagen] mit den beiden nachgezaehlten Zahlwoertern, den Kommentar ueber [zaehlung.handelsblock], den Kommentar ueber [zaehlung.pruefgegenstaende], eine neue Begruendung ueber gesetzt_zerlegung in [zaehlung] und einen neuen Kommentar ueber sollreihen im Block der Reihe 9. Nicht geaendert ist datei.stand, weil dort schon 2026-09-04 stand. Die Grep-Zahlen der sieben Schnitte sind nach dem Eingriff neu gezaehlt worden und sind unveraendert, alle dreizehn Muster einzeln; bei schnitt_1 sind zusaetzlich die sechs Trefferkontexte alt gegen neu verglichen worden und sind dieselben -- eine gleiche Zahl aus anderen Stellen waere sonst unbemerkt geblieben. Geaendert hat sich innerhalb von schnitt_5 allein die Aufteilung seiner 21 Zeilen auf die Reihen und ihre Summe, 39 statt 43; dieselbe Nachziehung tragen zaehlregel_sollreihen und falle, und alle drei stehen unter den zwanzig."
toml_geprueft_grenze = "Was die sieben Schnitte allein nicht leisten: Sie pruefen Form und Zaehlung, nicht die Grammatik von TOML 1.0. Eine Verletzung, die keines der sieben Muster trifft -- etwa ein ungueltiger Schluesselname oder eine falsch verschachtelte Tabelle --, bliebe unentdeckt. Diese Luecke schliesst seit dem 2026-09-03 der Parserlauf aus toml_geprueft, und nur er. Wer diese Datei in einem Lauf ohne ausfuehrbares Werkzeug prueft, hat die Luecke wieder und prueft die Grammatik zuerst, sobald er ein Werkzeug dafuer hat."
schnitt_1 = "Dezimalpunkt (T4, Leseregel 5). Grep-Muster [=] [0-9]+\\.[0-9], output_mode content. Ergebnis: 6 Treffer. Alle sechs stehen innerhalb einer Zeichenkette und sind deutsche Tausendertrenner (10.000, 1.000); kein blanker Zahlenwert traegt einen Punkt. Die sechs Fundstellen als Adresse plus Zitat, damit sie eine Einfuegung ueberleben -- jedes Zitat ist absichtlich vor dem Gleichheitszeichen abgeschnitten, sonst zaehlte dieser Schnitt sich selbst mit. Erstens [[widerspruch]] Nr. 4, Feld kurz, beginnend mit Faktor 10.000 auf den Rohkurs gegen T5 Klasse 6. Zweitens [[widerspruch]] Nr. 4, Feld lang, beginnend mit Das Arbeitspaket gibt fuer Reihe 10 den Faktor 10.000 vor. Drittens Reihe 4, Feld begruendung ihres Blocks [[reihe.umrechnung]], beginnend mit T5 Klasse 7 (Realindizes): Index, Startjahr. Viertens Reihe 10, erster Eintrag ihres Feldes offen, beginnend mit Der Faktor 10.000 auf den Rohkurs steht gegen T5 Klasse 6. Fuenftens Reihe 15, Feld begruendung ihres Blocks [[reihe.umrechnung]], beginnend mit T5 Klasse 5 (Nominalindizes, darunter Preisniveau): Index, Startjahr. Sechstens Reihe 17, Feld begruendung ihres Blocks [[reihe.umrechnung]], beginnend mit Kein Fremdbestand, keine Quelleneinheit, also keine Umrechnung -- dieser Halbsatz trennt sie von den Reihen 18 und 19, deren begruendung nach Kein Fremdbestand anders weitergeht. Gebrochene Zahlen stehen skaliert mit dem Faktor im Schluesselnamen, siehe umrechnungskurs_dem_je_eur_mal_100000 in Reihe 10."
schnitt_2 = "Begrenzer der Zeichenketten. Die Muster sind so geschrieben, dass die Zeile, die sie nennt, sie nicht selbst enthaelt -- sonst zaehlte der Schnitt sich mit. Grep-Muster [']{3} zaehlt 29 Zeilen; dasselbe Muster mit -o zaehlt 54 Vorkommen, also eine gerade Zahl und damit paarweise. Grep-Muster ^[']{3}|[']{3}$ zaehlt 27 Zeilen: 25 Zeilen, die ein Literal oeffnen und schliessen, plus die zwei Schlusszeilen der beiden mehrzeiligen Literale. 25 mal 2 plus 4 ergibt 54, die Rechnung geht auf. Bis zum 2026-09-03 lauteten die drei Zahlen 28, 52 und 26; hinzugekommen ist das einzeilige Literal im Feld lang des neunten Widerspruchs. Das Gegenstueck aus drei doppelten Anfuehrungszeichen kommt in genau einer Zeile vor: im Feld wortlaut des Blocks [[reihe.lizenzbeleg]] der Reihe 14, dem Etalab-Text, der mit den Worten Il est garanti au beginnt. Er fuehrt Apostrophe und kann deshalb kein Apostroph-Literal sein. Genau zwei Literale erstrecken sich ueber mehrere Zeilen, beide im Feld wortlaut ihres Blocks [[reihe.lizenzbeleg]]: bei Reihe 6 ueber drei Zeilen, beginnend mit International Labour Organization (ILO), type: estimates based on external database; und bei Reihe 13 ueber fuenf Zeilen, beginnend mit Staff estimates; und endend mit Consolidated Tariff Schedules (CTS), World Trade Organization (WTO)."
schnitt_2_wahl = "Warum diese zwei mehrzeilig stehen und nicht ein Feld wortlaut_normalisiert daneben traegt: Der Wortlaut ist mehrzeilig zeichengleich zur Quelle statt nur sinngleich, und ein Vermerk daneben haette die Ersetzung zwar dokumentiert, den Vergleich gegen die Schnittstelle aber weiterhin scheitern lassen. Voraussetzung dafuer war eine Pruefung vor der Wahl: Ein Apostroph-Literal darf keinen Apostroph enthalten und nicht auf einem enden, und ein Dezimalpunkt oder ein doppeltes Anfuehrungszeichen im Text braeche schnitt_1 oder schnitt_2. Keiner der beiden Texte fuehrt eines davon; deshalb war der bessere Weg auch der gangbare."
schnitt_2_offen = "Nicht Gegenstand dieses Pakets, hier nur benannt, damit schnitt_2 nicht mehr behauptet, als er zeigt: Drei weitere Wortlaute tragen dieselbe Ersetzung ohne Vermerk, je drei Quellzeilen in einer Zeile. Es sind erstens die Felder wortlaut der Bloecke [[reihe.lizenzbeleg]] von Reihe 1 und von Reihe 2a -- beide beginnen mit Country official statistics, National Statistical Organizations and/or Central Banks -- gegen lizenzbefund-reihen.md, Abschnitt Reihe 1, den Block unter der Zwischenzeile Feld `Source` im Wortlaut. Und zweitens das Feld wortlaut des Blocks von Reihe 2b und 2c, beginnend mit Country official statistics, National Statistical Offices (NSOs), gegen lizenzbefund-reihen.md, Abschnitt 2b und 2c, den Block unter der gleichlautenden Zwischenzeile Feld `Source` im Wortlaut -- dort mit dem Zusatz, dass er bei beiden Codes zeichengleich derselbe ist. Der Pruefbefund zu 0017 nennt allein Reihe 6 und Reihe 13, und das Arbeitspaket 0022 laesst keine vierte Aenderung zu. Wer die drei angleicht, braucht ein eigenes Paket."
schnitt_3 = "Tabellenkoepfe. Grep-Muster ^\\[\\[ zaehlt 113 Zeilen. Dasselbe Muster nach Typ aufgezaehlt ergibt ebenfalls 113: 19 mal reihe, 9 mal widerspruch, 22 mal reihe.umrechnung, 20 mal reihe.lizenzbeleg, 39 mal reihe.deckung, 2 mal reihe.konkordanz, 2 mal reihe.bruch. Weil beide Zahlen gleich sind, gibt es keinen achten, unbenannten Tabellentyp. Alle Untertabellen folgen ihrem Reihenblock; kein Schluessel steht nach einer Untertabelle wieder auf Reihenebene. Bis zum 2026-09-03 lauteten die Zahlen 112 und 8 mal widerspruch; hinzugekommen ist der neunte Widerspruch, die Preisbasis von Reihe 14 gegen T5 Klasse 2."
schnitt_4 = "Pflichtfelder je Reihe. Die Muster tragen das Gleichheitszeichen mit, sonst zaehlen sie verwandte Schluessel mit. Grep-Muster ^exogen_ab = zaehlt 19, ^verkettet_ab = zaehlt 19, ^lizenzurteil = zaehlt 19. Das Sammelmuster ^(lizenzurteil|bezeichnung|dimension|modelleinheit|quelle_tabelle|rolle_tabelle|verdacht_tabelle|quelle_eingebettet) = zaehlt 152, also 8 mal 19. Bei 19 Reihenbloecken aus schnitt_3 heisst das: jedes dieser Felder steht genau einmal je Reihe -- keines fehlt, keines steht doppelt. Grep-Muster ^t37_klasse = zaehlt 20: 19 Reihen plus die eine Zeile in zaehlung.handelsblock. Grep-Muster ^nr = zaehlt 28, also 19 Reihen plus 9 Widersprueche; bis zum 2026-09-03 waren es 27 bei acht Widerspruechen."
schnitt_5 = "Sollreihen. Grep-Muster ^sollreihen = mit output_mode content ergibt 21 Zeilen, und keine Zeilennummer wird dafuer gebraucht: 19 davon stehen auf Reihenebene, genau eine je [[reihe]], und zwei stehen in einer Untertabelle -- die beiden Bloecke [[reihe.lizenzbeleg]] der Reihe 2, mit dem Wert 4 beim Beleg zu 2a und dem Wert 8 beim Beleg zu 2b und 2c; siehe falle. Ohne das Gleichheitszeichen sind es 28, weil dann die sieben Summenschluessel mitzaehlen: die vier in [zaehlung] (sollreihen_gesamt, sollreihen_frei, sollreihen_gesetzt, sollreihen_abgeleitet) und die drei in [zaehlung.lizenz] (sollreihen_frei, sollreihen_unklar, sollreihen_gesperrt). Die 19 auf Reihenebene tragen vierzehn Nullen und fuenf Werte, bei den Reihen 1, 2, 8, 10 und 11: 4 plus 12 plus 4 plus 3 plus 4 ergibt 27. Die Summe ueber alle 21 Zeilen ist 39 und die Zahl, auf die ein Zeilenzaehler hereinfaellt. Bis zum 2026-09-03 lauteten diese vier Angaben dreizehn Nullen, sechs Werte mit Reihe 9 dazwischen, 31 und 43; Reihe 9 traegt seither die Null."
schnitt_6 = "Doppelter Schluessel innerhalb einer Tabelle. Ohne Parser ist das nicht vollstaendig zeigbar; was ohne Parser zeigbar ist, steht in schnitt_4 und schnitt_5: Fuer die zehn Schluessel eines Reihenblocks, die schnitt_4 auf 19 zaehlt, ist die Zeilenzahl genau die Blockzahl 19, und ein zweites Vorkommen innerhalb eines Blocks wuerde sie anheben. Zehn und nicht elf -- der Schluessel lizenzurteil steht in schnitt_4 zweimal, einzeln und im Sammelmuster; bis zum 2026-09-03 stand hier elf. Nicht abgedeckt sind die selteneren Schluessel und die Schluessel der Untertabellen. Seit dem 2026-09-03 ist der Punkt darueber hinaus maschinell erledigt: TOML 1.0 verbietet den doppelten Schluessel, tomllib bricht darauf mit einem Fehler ab, und der Lauf aus toml_geprueft ist fehlerfrei durchgelaufen. Wer die Datei ohne ausfuehrbares Werkzeug prueft, hat nur den ersten Teil."
schnitt_7 = "Wortlautfelder. Grep-Muster ^wortlaut = zaehlt 20, eines je Lizenzbeleg aus schnitt_3. Vier davon sind leer: die Reihen 16, 17, 18 und 19 ohne eigene Quelle, siehe zaehlregel_lizenz. Grep-Muster ^wortlaut_form zaehlt 2, die beiden mehrzeiligen Wortlaute aus schnitt_2."
zaehlregel_sollreihen = "Summiere den Schluessel `sollreihen` je [[reihe]] -- also nur auf der obersten Ebene eines Reihenblocks. Ergebnis 27. Bis zum 2026-09-03 waren es 31; Reihe 9 traegt seither 0."
zaehlregel_t37 = "Gruppiere dieselben Werte nach `t37_klasse` der Reihe. Ergebnis frei 23 (Reihen 1, 2, 8, 10 mit 4 + 12 + 4 + 3), abgeleitet 4 (Reihe 11). Die Klasse `gesetzt` ist seit dem 2026-09-03 leer und entfaellt; Reihe 9 trug sie mit 4 und fuehrt seither ein leeres `t37_klasse` bei `sollreihen = 0`. Ein leeres `t37_klasse` bedeutet keine Klasse und bildet keine Gruppe -- so steht es bei allen dreizehn Reihen ohne T37-Klasse, Reihe 9 seit dem 2026-09-03 mitgezaehlt."
handelsblock = "Reihe 14 traegt `t37_klasse = frei` bei `sollreihen = 0` und `handelsblock_stroeme = 40`. Sie ist die einzige Nicht-Sollreihe mit Klasse; das verlangt die Abnahme so. Der Satz gilt auch nach dem 2026-09-03 unveraendert: Reihe 9 ist seither ebenfalls eine Nicht-Sollreihe, traegt aber ein leeres `t37_klasse` und ist deshalb kein zweiter Fall."
falle = '''Ein `grep` auf `^sollreihen = ` findet zwei Zeilen zu viel: Die beiden Belegbloecke [[reihe.lizenzbeleg]] der Reihe 2 fuehren denselben Schluesselnamen fuer die Aufteilung 4 (2a) + 8 (2b und 2c). Ein TOML-Leser verwechselt sie nicht, weil sie in einer Untertabelle stehen; ein Zeilenzaehler schon und kaeme auf 39 (bis zum 2026-09-03: 43). Der Name ist beim Nachtragen dieser Zeile nicht mehr aenderbar gewesen, deshalb steht die Falle hier statt in einem Kommentar, den ein Werkzeug ueberliest.'''
zaehlregel_umrechnung = "Jede Reihe fuehrt mindestens einen Block [[reihe.umrechnung]]. Genau einer traegt `art = ungemessen` und keinen Faktor: Reihe 3, der PWT-Kapitalstock. Das ist Absicht, siehe Leseregel 3 im Kopf. Reihe 14 (BACI) hat diesen Stand bis Paket 0036 geteilt und traegt seither `art = keine`, `faktor = 1` und `status = gemessen`. Das ist eine gemessene und keine gesetzte Eins -- der Unterschied steht in Leseregel 3, der Beleg in den Feldern `begruendung` und `beleg` des Blocks. Eine gesetzte Eins bleibt verboten. Entschieden ist damit allein die Groessenordnung; die Preisbasis der Reihe 14 ist offen, siehe [[widerspruch]] Nr. 9."
zaehlregel_lizenz = "Jede Reihe fuehrt `lizenzurteil` aus frei | gesperrt | unklar und mindestens einen Block [[reihe.lizenzbeleg]] mit `wortlaut`, `url` und `abrufdatum`. Leer sind diese drei Felder allein bei den Reihen 16, 17, 18 und 19 -- den vier Reihen ohne eigene Quelle; siehe [[widerspruch]] Nr. 7 und Nr. 8."
