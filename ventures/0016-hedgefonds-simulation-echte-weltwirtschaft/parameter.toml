# =====================================================================
# parameter.toml -- die Kalibrierdatei des Spiels
#
# Paket 0009-parameterdatei-schluessel, Datenbauer, Stand 2026-09-02.
# Quellen: specs/0016-.../technik.md T5, T27, T45, T46, T47, T50, T51,
#          T23 Punkt 5, T15, T16, T6, T40; specs/0016-.../spiel.md
#          (Aktionen, Gegenkraefte, "Jede Groesse ohne Datenanker",
#          Kanaltabelle, "Der Fehlbetrag", "Offene Entwurfsfragen").
#
# ---------------------------------------------------------------------
# WAS DIESE DATEI IST
#
# T27: "Die Kalibrierdatei liegt ausserhalb des Codes, und jeder
# Schluessel traegt eine Skalenklasse." Hier steht die *Form* -- jeder
# Schluessel, seine Skalenklasse nach T5, sein Wertebereich, die Stelle
# in specs/, aus der die Schranke stammt, und wer ihn kalibriert.
#
# ---------------------------------------------------------------------
# WAS DIESE DATEI NICHT IST
#
# **Keine Zahl in dieser Datei ist kalibriert.** spiel.md ("Offene
# Entwurfsfragen") und technik.md Abschnitt 12 sagen dasselbe: Die Werte
# werden vom Selbstspieler *gesucht*, nicht entworfen.
#
# Regel fuer jeden Platzhalter, damit keiner wie ein Ergebnis aussieht:
#
#   A) Skalare: Wo eine untere Schranke steht, ist der Platzhalter genau
#      diese Schranke; wo keine steht, 0.
#   B) Wertebereiche der Instrumente: Der Wertebereich ist keine
#      Kalibriergroesse im selben Sinn -- er muss nach T51 im `weltlauf`
#      den historischen Pfad enthalten, sonst erzeugt der Jahrgangsbau
#      einen Befund. Der Platzhalter ist deshalb **weit**, nicht eng.
#      Weit heisst: er schraenkt nichts ein und nimmt nichts vorweg.
#      Die Zahl, die ihn eng macht, ist eine Kalibrierung.
#
# **Folge, ausdruecklich benannt:** Dieser Satz ist zulaessig, aber
# wirkungslos. `druck_max = 1`, `gegenlobby_satz = 0`, `hebel_max = 0`
# und `nachahmer_max = 0` schalten Lobbyismus, Gegenlobby, Hebel und
# Nachahmer praktisch ab. Das ist Absicht: Ein Satz, in dem jede Zahl an
# ihrer Schranke klebt, kann von niemandem fuer ein Ergebnis gehalten
# werden. Die erste Aufgabe des Selbstspielers ist, einen zu finden, der
# nicht wirkungslos ist.
#
# ---------------------------------------------------------------------
# LESEART DER WERTE
#
# T27: "Alle Werte werden als Dezimalzeichenketten in skalierte
# Ganzzahlen gelesen (T4) und in eine Struktur mit benannten Feldern
# gefuellt, nie ueber eine Schleife ueber Schluessel (T9)."
#
# Hier stehen sie als **TOML-Ganzzahlen**, nicht als Zeichenketten in
# Anfuehrungszeichen. Begruendung, und sie ist eine Entscheidung dieses
# Pakets: Eine TOML-Ganzzahl ist per Sprachdefinition ein i64; ein Wert
# mit Dezimalpunkt waere eine TOML-Gleitkommazahl und faellt damit schon
# beim Einlesen auf, statt erst beim Umwandeln. Das Verbot aus T4 wird so
# vom Parser getragen und nicht von unserem Code. Als Zeichenkette waere
# "1.5" ein gueltiger TOML-Wert. -- Gemeldet im Logbuch; wer es anders
# will, braucht eine Zeile in einem Befund, keinen ADR.
#
# ---------------------------------------------------------------------
# SKALENKLASSEN (T5), soweit sie hier vorkommen
#
#   1  Fondsgeld ................ US-Cent
#   3  Raten .................... Basispunkte (1 bp = 0,01 %)
#   4  Anteile .................. Zehntausendstel (10.000 = 100 %)
#   9  Lobbydruck ............... Lobbypunkte, 0 ... druck_max
#  10  Instrumentenstufe ........ Stufe, 0 ... regulierung_stufen
#  11  Zaehler und Restdauern ... Stueck bzw. Runden
#
# ---------------------------------------------------------------------
# WIE DER PRUEFER ZAEHLT
#
#   Gruppe A, Tabelle in T27 ....................... 10 Skalare
#   Gruppe A, Instrumente nach T51 .. 4 x 3 ........ 12
#   Gruppe B, Fliesstext in T27 .................... 12
#   Gruppe B2, "Verzoegerungen" aus T27 ............  4
#   Gruppe C, "Elastizitaeten" aus T27 ............. 12
#                                                   ---
#                                                    50 Schluessel
#
#   Davon 46 mit `# PLATZHALTER` und 4 mit `# FEST (T51)`.
#   `grep -c PLATZHALTER` und `grep -c 'FEST (T51)'` zaehlen es nach.
#
# **Ein `*` hinter einem Schluesselnamen im Kommentar heisst: Der Name
# steht in keinem Dokument woertlich und ist nach dem Muster der
# uebrigen gebildet.** Dieselbe Kennzeichnung wie im Adressverzeichnis
# aus Paket 0007. 25 der 50 Namen sind so gebildet; sie stehen einzeln
# unter BEFUNDE am Dateiende.
#
# ---------------------------------------------------------------------
# WAS HIER BEWUSST NICHT STEHT
#
# * `leitzins_start[l]` -- keine Kalibriergroesse, sondern eine Messung;
#   sie steht im Jahrgang (T27, T23 Punkt 5).
# * `durchgriff` -- Konstante des Jahrgangs (T23 Punkt 5).
# * `markt.wert` (Startkorb zu Startpreisen) -- Manifest (T33, T45).
# * Die Partielaenge R -- Groesse des Jahrgangs, `R =
#   manifest.stuetzstellen - 1`, keine Konstante des Codes (T40).
# * Die Pruefsumme des Parametersatzes -- sie wird ueber diese Datei
#   *gerechnet* und in `partie.parameter_pruefsumme` abgelegt (T27, T45).
#   Ein Schluessel dafuer in dieser Datei waere die Pruefsumme ihrer
#   selbst.
# * Zahlen, die spiel.md bereits festlegt und die deshalb keine
#   Kalibriergroessen sind: drei Aktionen je Runde, zwei Runden
#   Ausstiegsdauer der Beteiligung, drei Runden bis zum Anlegerabzug,
#   eine Runde Verzug des Gegendrucks, Faktor 2 auf die Lobbykosten nach
#   einem Regierungswechsel, 40 Halbierungsschritte der Marktraeumung
#   (T28).
#
# Diese Datei traegt **keinen Datenanker**. Sie enthaelt keine Zahl aus
# einer externen Quelle, also auch keine Namensnennung; die Lizenzen und
# ihre Namensnennung gehoeren zum Jahrgang und stehen in dessen
# Manifest (T23).
# =====================================================================


# ---------------------------------------------------------------------
# GRUPPE A -- die elf Zeilen der Tabelle in T27
# ---------------------------------------------------------------------

# Klasse 4 (Anteile, Zehntausendstel). Anteil des Marktes je
# Positionsstufe -- **kein Geldbetrag** (T5, T27, spiel.md Fassung 5).
# Schranke: ganzzahlig und >= 1 (T47), <= 10.000 aus der Klasse (T5).
# Kalibriert: Selbstspieler, zusammen mit `startkapital`.
# Scheitert daran: Zu gross -- eine Stufe auf dem groessten der sechzehn
#   Startmarktwerte ist nicht bezahlbar, Klasse 1 von Mass 2 gewinnt nie.
#   Zu klein -- erreichbare Stufenzahlen erreichen die Aufsichtsschwellen
#   nicht, keine Gegenkraft greift, Mass 3 faellt auf null. Die beiden
#   Zahlen, an denen man das abliest (kleinster und groesster der
#   sechzehn Startmarktwerte), weist der Jahrgangsbau im Manifest aus
#   (T47, spiel.md "Offene Entwurfsfragen").
stufenweite = 1  # PLATZHALTER

# Klasse 11 (Zaehler). Betragsgrenze der Stufenzahl je Steckplatz; die
# Positionsstufe liegt in `-stufen_max ... +stufen_max` (T5, T16, T27).
# Schranke: >= 1. Bei 0 ist jeder der zwanzig Steckplaetze dauerhaft
#   leer und Aktion 1 wirkungslos -- Folgerung, keine Vorgabe aus specs/.
# Kalibriert: Selbstspieler.
# Scheitert daran: Zu klein -- Klasse 1 von Mass 2 kann nicht gewinnen.
#   Zu gross zusammen mit `stufenweite` -- eine einzelne Position ueber-
#   steigt den Markt, an dem sie haengt (`stufen_max * stufenweite >
#   10.000`); die Schranke dafuer steht in keiner Vorgabe, die Wirkung
#   sieht der Bruchtester im 200-Runden-Lauf.
stufen_max = 1  # PLATZHALTER

# Klasse 4 (Anteile). Abschlag auf den Beteiligungswert, im Wertansatz
# enthalten und damit beim **Aufbau** bezahlt; beim gewoehnlichen
# Ausstieg wird er nicht ein zweites Mal abgezogen (T47 Punkt 1,
# spiel.md "Was das Fondsvermoegen ist").
# Schranke: 0 ... 10.000 aus der Klasse (T5).
# Kalibriert: Selbstspieler.
# Scheitert daran: Bei 10.000 ist jede Beteiligung sofort wertlos und
#   Klasse 2 von Mass 2 chancenlos; bei 0 ist Aktion 2 kostenlos und die
#   Illiquiditaet die einzige Bremse.
ausstiegsabschlag = 0  # PLATZHALTER

# Klasse 4 (Anteile). Zusaetzlicher Abschlag beim Zwangsverkauf aus
# Gegenkraft 1 -- eine zweite Strafe, keine Ersetzung von
# `ausstiegsabschlag` (T47 Punkt 2).
# Schranke: 0 ... 10.000 aus der Klasse (T5).
# Kalibriert: Selbstspieler.
# Scheitert daran: Bei 0 ist die zweite Aufsichtsschwelle folgenlos und
#   Gegenkraft 1 haengt allein an der dritten.
zwangsabschlag = 0  # PLATZHALTER

# Klasse 3 (Raten, Basispunkte). Abstand zwischen Leitzins und
# Anleiherendite; Nenner von `anleihekurs(l)` (T27, spiel.md "Der
# Anleihekurs").
# Schranke: `aufschlag >= aufschlag_min` mit
#   `aufschlag_min = 1 - min ueber alle l und t von leitzins_pfad[l][t]`
#   (T51, T23 Punkt 5). **Die Zahl kommt aus dem Jahrgang**; sie steht
#   hier als Verweis und nicht als Wert. T23 Punkt 5 nennt fuer
#   1997-2021 zwei Kandidaten, je nachdem welche EZB-Reihe eingebettet
#   wird: 51 (Einlagesatz, tiefster Stand -0,50 %) oder 1
#   (Hauptrefinanzierungssatz, tiefster Stand 0,00 %).
# Platzhalter: 51, also der kleinste Wert, der **beide** Kandidaten
#   einhaelt. Ist das `aufschlag_min` des tatsaechlich eingebetteten
#   Jahrgangs groesser, weist der Jahrgangsbau diesen Satz zurueck --
#   das ist die vorgesehene Wirkung und kein Fehler dieser Datei.
# Kalibriert: Selbstspieler, gegen die Schranke des Jahrgangs.
# Scheitert daran: Zu klein -- `leitzins + aufschlag` wird null oder
#   negativ, `anleihekurs` teilt durch null oder wechselt das Vorzeichen.
#   Das ist die einzige Stelle des Modells, an der ein Kurs unendlich
#   wird (T51); drei Stellen pruefen sie (Jahrgangsbau, Instrument,
#   Invariantentest T30 Pruefung 2).
# **Gekoppelt an `instrument_min` des Leitzinses** -- wer diesen Wert
#   aendert, prueft `[instrument.leitzins]` mit.
aufschlag = 51  # PLATZHALTER

# Klasse 1 (Fondsgeld, US-Cent). Preis eines Lobbypunkts:
# `lobbypunkte_aus_geld(cent, rabatt) =
#      mal_geteilt(cent, 10.000, lobbykosten * rabatt)` (T50, Uebergang 2).
# Schranke: >= 1 (T50). Bei 0 ist der Nenner null -- nach T6 ein harter
#   Fehler, kein stiller Ersatzwert.
# Kalibriert: Selbstspieler, gemeinsam mit `startkapital` und
#   `druck_max` -- die drei entscheiden zusammen, wie viel Druck ein
#   Fonds ueberhaupt erzeugen kann.
# Scheitert daran: Zu klein -- Einfluss ist frei kaeufbar, die zweite
#   Haelfte des Mandats trivial. Zu gross -- Aktion 3 ist unbezahlbar,
#   Klasse 3 von Mass 2 gewinnt nie.
# Hinweis, keine eigene Groesse: Nach einem Regierungswechsel
#   verdoppelt Gegenkraft 2 diese Kosten fuer `lobbykosten_dauer` Runden.
#   Den Faktor 2 legt spiel.md fest, er ist kein Schluessel.
lobbykosten = 1  # PLATZHALTER

# Klasse 4 (Anteile). Preisnachlass auf den Lobbypunkt bei Beteiligung
# im betroffenen Sektor. `rabatt` ist 10.000 ohne und
# `beteiligungsrabatt` mit Beteiligung; **der Rabatt sitzt am Preis
# eines Lobbypunkts, nicht an der Punktzahl** (T50).
# Schranke: `1 <= beteiligungsrabatt <= 10.000` (T50). Die 1 unten, weil
#   `lobbykosten * rabatt` der Nenner ist (T6); die 10.000 oben, weil ein
#   groesserer Wert kein Nachlass mehr waere.
# Kalibriert: Selbstspieler.
# Scheitert daran: Zu klein -- Beteiligung ist der einzige sinnvolle Weg,
#   Klasse 2 und 3 von Mass 2 fallen zusammen. Bei 10.000 gibt es keinen
#   Nachlass, und spiel.md sagt Aktion 3 mit Beteiligung einen
#   "Bruchteil" der Kosten zu.
beteiligungsrabatt = 1  # PLATZHALTER

# Klasse 9 (Lobbydruck, Lobbypunkte). Lobbypunkte je 10.000 Tausend USD
# Schaden: `lobbypunkte_aus_schaden(tsd) =
#      mal_geteilt(tsd, gegenlobby_satz, 10.000)` (T50, Uebergang 3).
# Schranke: >= 0. specs/ nennt keine obere Schranke; wirksam begrenzt
#   ist das Ergebnis durch `druck_max` (T5 Klasse 9).
# Kalibriert: Selbstspieler.
# Scheitert daran: Bei 0 gibt es keine Gegenlobby, Gegenkraft 5 ist aus
#   und Kanal 3 ungedaempft. Zu gross -- jede durchgesetzte Lobbyaktion
#   erzeugt sofort mehr Gegendruck als Druck, Aktion 3 ist tot.
# *Wie hoch* der Schaden eines Sektors ist, bleibt Sache von spiel.md und
#   des Kernbauers; T50 legt nur die Einheit fest, in der er ankommt.
gegenlobby_satz = 0  # PLATZHALTER

# Klasse 9 (Lobbydruck). Obergrenze fuer Druck und Gegendruck je
# Instrument; die Klasse 9 ist definiert als `0 ... druck_max`
# (T5, T27).
# Schranke: >= 0 aus der Klasse; >= 1, sonst ist die Klasse leer und
#   Aktion 3 ohne Wirkung -- Folgerung, keine Vorgabe aus specs/.
# Kalibriert: Selbstspieler.
# Scheitert daran: Zu klein -- Druck saettigt sofort, Einfluss (der
#   Anteil am gesamten Druck) wird zu einer groben Stufenfunktion. Zu
#   gross -- die Kappung greift nie und Kanal 8 ist ungedaempft.
druck_max = 1  # PLATZHALTER

# Klasse 10 (Instrumentenstufe). Zahl der Stufen der
# Finanzmarktregulierung; der Wertebereich des Instruments ist
# `0 ... regulierung_stufen` (T5 Klasse 10, T27, T51).
# Schranke: >= 1. Bei 0 hat das Instrument einen einzigen Stand und die
#   Aufsicht keinen Angriffspunkt auf den Fonds -- genau der Grund, aus
#   dem spiel.md das Instrument ueberhaupt fuehrt.
# Kalibriert: Selbstspieler.
# Scheitert daran: Zu klein -- die erste Aufsichtsschwelle bewegt das
#   Instrument einmal und danach nie wieder. Zu gross -- bei einer Stufe
#   je Runde (T51) erreicht es in R Runden nie eine wirksame Hoehe.
# **Gekoppelt an `instrument_max` der Regulierung und an
#   `regulierung_start`** -- wer diesen Wert aendert, prueft beide mit.
regulierung_stufen = 1  # PLATZHALTER


# ---------------------------------------------------------------------
# GRUPPE B -- die uebrigen Kalibriergroessen aus dem Fliesstext von T27
# ---------------------------------------------------------------------

# Klasse 1 (Fondsgeld, US-Cent). Vermoegensschwelle des Mandats; zugleich
# Nenner des Fehlbetrags
# `v = teile_gerundet(max(0, schwelle_v - fondsvermoegen) * 1.000,
#                     schwelle_v)` (spiel.md "Der Fehlbetrag", T27).
# Schranke: >= 1, weil Nenner (T6: Nenner null ist ein harter Fehler).
# Kalibriert: Selbstspieler, im Verhaeltnis zu `startkapital`.
# Scheitert daran: Zu klein -- das Mandat ist in Runde 1 erfuellt und
#   Mass 1 misst nichts. Zu gross -- keine Partie erreicht es und der
#   ganze Ergebnisraum liegt im Band "ueberlebt".
schwelle_v = 1  # PLATZHALTER

# Klasse 4 (Anteile). Einflussschwelle des Mandats, in derselben Einheit
# wie `land.<L>.einfluss`; dem Spieler erscheint sie als 0 bis 100, die
# Umrechnung findet in der Sicht statt (T5). Nenner des zweiten
# Fehlbetrags, summiert ueber die zwei Laender mit dem hoechsten
# Einfluss (spiel.md "Der Fehlbetrag").
# Schranke: 1 ... 10.000 -- die 1, weil Nenner (T6), die 10.000 aus der
#   Klasse (T5).
# Kalibriert: Selbstspieler.
# Scheitert daran: Zu gross -- unerreichbar, weil Einfluss ein *Anteil*
#   am gesamten Lobbydruck ist und Gegenkraft 5 mit ihm waechst.
schwelle_e = 1  # PLATZHALTER

# `aufsicht_schwelle_1`*, `_2`*, `_3`* -- Klasse 11 (Zaehler).
# Die drei Aufsichtsschwellen aus Gegenkraft 1, in derselben Einheit wie
# `land.<L>.aufsichtszaehler` (T27 "drei Aufsichtsschwellen"; spiel.md
# Gegenkraft 1). Erste: Das Instrument Finanzmarktregulierung bewegt
# sich gegen den Fonds, unabhaengig von dessen Lobbybudget und mit
# Vorrang davor. Zweite: Die Beteiligung wird zwangsverkauft, mit
# `zwangsabschlag`. Dritte: Marktverbot in diesem Land fuer
# `marktverbot_dauer` Runden.
# Schranke: `1 <= _1 < _2 < _3 <= aufsicht_max`. Die strenge Ordnung
#   folgt aus der Reihenfolge in spiel.md ("bei der ersten ... bei der
#   zweiten ... bei der dritten"); ein Gleichstand liesse zwei Folgen in
#   derselben Runde eintreten und die Kette aus T18 koennte sie nicht
#   trennen.
# Kalibriert: Selbstspieler, gemeinsam mit `stufenweite` und
#   `startkapital` -- erreichbare Stufenzahlen muessen diese Schwellen
#   ueberhaupt erreichen koennen (T47, spiel.md).
# Scheitert daran: Zu hoch -- keine Gegenkraft greift, Mass 3 faellt auf
#   null. Zu niedrig -- jede Partie stirbt am Marktverbot, bevor Mass 2
#   drei Klassen sehen kann.
aufsicht_schwelle_1 = 1  # PLATZHALTER
aufsicht_schwelle_2 = 2  # PLATZHALTER
aufsicht_schwelle_3 = 3  # PLATZHALTER

# `aufsicht_max`* -- Klasse 11 (Zaehler). Obergrenze des
# Aufsichtszaehlers. T5 Klasse 11 gibt den Bereich als
# "0 ... Obergrenze aus `parameter.toml`" an, spiel.md nennt als
# Daempfung von Kanal 5 "Zaehler ganzzahlig mit Obergrenze"; der
# Schluessel selbst steht in keinem Dokument.
# Schranke: >= `aufsicht_schwelle_3`, sonst ist die dritte Schwelle
#   unerreichbar.
# Kalibriert: Selbstspieler.
# Scheitert daran: Zu niedrig -- der Zaehler saettigt und Gegenkraft 1
#   hoert auf zu wachsen; zu hoch -- die Obergrenze daempft Kanal 5 nicht.
aufsicht_max = 3  # PLATZHALTER

# `nachahmer_tempo`* -- Klasse 11 (Zaehler). Die "Nachahmergeschwindigkeit"
# aus T27: Zuwachs des Nachahmerzaehlers je Runde mit Ueberrendite auf
# diesem Land x Sektor (spiel.md Gegenkraft 4).
# Schranke: >= 0. specs/ nennt keine obere; wirksam begrenzt durch
#   `nachahmer_max`.
# Kalibriert: Selbstspieler.
# Scheitert daran: Bei 0 ist keine Strategie selbstverbrauchend und
#   Mass 3 -- "was im ersten Drittel optimal war, ist im letzten
#   abgegrast" -- faellt auf null. Zu gross -- jede Position ist nach
#   einer Runde entwertet und Mass 1 verliert seine Entscheidungsdichte.
nachahmer_tempo = 0  # PLATZHALTER

# `nachahmer_max`* -- Klasse 11 (Zaehler). Obergrenze des
# Nachahmerzaehlers; Herkunft der Schranke wie bei `aufsicht_max`
# (T5 Klasse 11, spiel.md Kanal 6 "Zaehler ganzzahlig mit Obergrenze").
# Schranke: >= 0.
# Kalibriert: Selbstspieler.
# Scheitert daran: Bei 0 ist Gegenkraft 4 aus. Zu gross -- Kanal 6 ist
#   ungedaempft.
nachahmer_max = 0  # PLATZHALTER

# `anlegerabzug_anteil`* -- Klasse 4 (Anteile). Der "Anlegerabzugsanteil"
# aus T27: fester Anteil des Anlegerbestands, der je Runde abzieht,
# nachdem die Ueberrendite drei Runden unter null lag (spiel.md
# Gegenkraft 3, Kanal 7 "Abzug erst nach drei Runden, fester Anteil je
# Runde"). Die **drei Runden** legt spiel.md fest -- der Zustand haelt
# genau drei Ueberrenditen (T15) --, sie sind kein Schluessel.
# Schranke: 0 ... 10.000 aus der Klasse (T5).
# Kalibriert: Selbstspieler.
# Scheitert daran: Bei 0 ist die dritte Todesart unerreichbar und
#   Gegenkraft 3 wirkt nur ueber den Preisstoss. Bei 10.000 ist der
#   Fonds nach einer schlechten Serie sofort tot, und der frueh
#   Gestorbene fuellt das ganze Todesband.
anlegerabzug_anteil = 0  # PLATZHALTER

# Klasse 1 (Fondsgeld, US-Cent). Startkapital des Fonds.
# **Ein Schluessel, zwei Adressen:** Er bestimmt `fonds.kasse` *und*
# `fonds.anlegerbestand` (spiel.md "Fondskasse, Anlegerbestand | aus
# `parameter.toml` (Startkapital)"; T45 zaehlt beide als
# `Parameter(...)`). Das ist eine Vorgabe, keine Wahl dieses Pakets --
# als Befund am Dateiende vermerkt.
# Schranke: >= 1. Ein Fonds mit Nullvermoegen dividiert in Runde 1 durch
#   null und stirbt sonst spaetestens in Runde 3 am Anlegerabzug
#   (spiel.md, Modus `weltlauf`).
# Kalibriert: Selbstspieler, zusammen mit `stufenweite` -- nur das
#   Verhaeltnis beider Groessen wirkt, ein dritter Regler waere redundant
#   und ist deshalb nicht eingebaut (spiel.md).
# Scheitert daran: Zu klein -- eine Stufe auf dem groessten der sechzehn
#   Startmarktwerte ist nicht bezahlbar. Zu gross -- der Fonds bewegt in
#   Runde 1 jeden Markt und der Preisstoss dominiert alles.
startkapital = 1  # PLATZHALTER

# `startzustimmung`* -- Klasse 4 (Anteile). Startwert von
# `land.<L>.zustimmung` in allen vier spielbaren Laendern; **eine Zahl
# fuer alle vier**, weil T45 genau vier Adressen auf einen
# Parameterschluessel fuehrt (T27 "Startzustimmung", T45, spiel.md "Jede
# Groesse ohne Datenanker").
# Dem Spieler erscheint die Groesse als 0 bis 100 (T5).
# Schranke: 0 ... 10.000 aus der Klasse (T5); ueber
#   `zustimmung_wechselschwelle`, sonst wechselt jede Regierung in
#   Runde 1 -- Folgerung, keine Vorgabe aus specs/.
# Kalibriert: Selbstspieler.
# Scheitert daran: Zu niedrig -- Regierungswechsel in Runde 1 in allen
#   vier Laendern. Zu hoch -- Gegenkraft 2 erreicht ihre Schwelle in R
#   Runden nie und Kanal 2 ist tot.
startzustimmung = 0  # PLATZHALTER

# `regulierung_start`* -- Klasse 10 (Instrumentenstufe). Startstand der
# Finanzmarktregulierung in allen vier spielbaren Laendern (T27
# "Startstand der Finanzmarktregulierung", T45). Das Instrument hat
# keinen Datenanker und steht im `weltlauf` fest auf diesem Wert -- das
# Orakel ist fuer dieses Instrument blind, und das gehoert in jeden
# Befund (spiel.md, T23 Punkt 3).
# Schranke: `0 ... regulierung_stufen` (T51).
# Kalibriert: Selbstspieler.
# Scheitert daran: Bei `regulierung_stufen` kann die Aufsicht nicht mehr
