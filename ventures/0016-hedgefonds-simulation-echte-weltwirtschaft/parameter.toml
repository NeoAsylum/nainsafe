# ---------------------------------------------------------------------
# GRUPPE A, Fortsetzung -- die Instrumente nach T51
#
# Feste Reihenfolge nach T9: leitzins, zoll, haushalt, regulierung.
# Die drei Schluesselnamen je Instrument stehen woertlich in T27
# (`schrittweite[i]`, `instrument_min[i]`, `instrument_max[i]`); als
# Tabelle je Instrument statt als Feld ueber einen Index, weil T27 die
# Struktur mit **benannten Feldern** verlangt und eine Schleife ueber
# Schluessel ausschliesst (T9).
#
# Nach jeder Bewegung in Schritt 3 gilt
# `stand = min(max(stand +/- schritt, min), max)`; die Kappung traegt die
# Ursache des ausloesenden Drucks und nicht `Vortrag`, damit die Kette
# aus T18 sagt, *dass* gekappt wurde (T51).
#
# **Im `weltlauf` gilt die Schrittweite nicht** -- der historische Pfad
# ist dort die Wahrheit und darf in einem Jahr weiter springen --, **der
# Wertebereich schon**: Verlaesst der Pfad ihn, ist das ein Befund des
# Jahrgangsbaus und kein stilles Kappen einer Sollgroesse (T51). Daraus
# folgt Regel B fuer die Platzhalter: Die Wertebereiche stehen hier
# **weit**. Ein enger Wertebereich waere eine Kalibrierung.
# ---------------------------------------------------------------------

# Klasse 3 (Raten, bp). Datenanker Reihe 9 (IWF IFS); fuer Deutschland
# exogen ab 1999, also ab Runde 3 (spiel.md, T23 Punkt 8).
# `instrument_min` traegt die einzige Schranke des Modells, an der ein
# Kurs unendlich wird: **`instrument_min >= 1 - aufschlag`** (T51). Mit
# `aufschlag = 51` heisst das `>= -50`; der Platzhalter steht genau
# darauf, weil der tiefste bekannte Stand im Pruefjahrgang der
# EZB-Einlagesatz von -0,50 % ist (T23 Punkt 5).
# `instrument_max` weit: Brasiliens Leitzins liegt am Anfang des
# Pruefjahrgangs im zweistelligen Prozentbereich, ein enger Wert erzeugte
# einen Befund des Jahrgangsbaus.
# Kalibriert: Selbstspieler (`schrittweite`); die beiden Grenzen sind
#   gegen den Jahrgang zu pruefen, nicht zu suchen.
# Scheitert daran: `schrittweite` zu klein -- der Spieler bewegt den Zins
#   in R Runden nicht spuerbar; zu gross -- ein Schritt je Runde ist
#   keine Daempfung von Kanal 8 mehr.
[instrument.leitzins]
schrittweite = 1  # PLATZHALTER
instrument_min = -50  # PLATZHALTER
instrument_max = 10000  # PLATZHALTER

# Klasse 3 (Raten, bp). Aggregiertes Zollniveau je Land, Datenanker
# Reihe 13 (WDI aus WITS) -- **die Reihe mit dem entscheidenden
# Lizenzverdacht** (T26, T51). Faellt sie aus, laeuft der Weltlauf mit
# konstantem Zoll und das Orakel traegt zwei statt drei verankerte
# Instrumente; an dieser Datei aendert das nichts.
# `instrument_min` ist nach T51 **fest 0** -- der Wertebereich lautet
# dort `0 ... instrument_max[zoll]`, ein negativer Zoll waere eine
# Subvention und ist im Modell nicht vorgesehen.
# Kalibriert: Selbstspieler (`schrittweite`).
# Scheitert daran: `instrument_max` zu eng -- der historische Pfad
#   verlaesst den Bereich und der Jahrgangsbau meldet einen Befund.
[instrument.zoll]
schrittweite = 1  # PLATZHALTER
instrument_min = 0  # FEST (T51)
instrument_max = 10000  # PLATZHALTER

# Klasse 3 (Raten, bp). Haushaltssaldo bzw. Staatsausgabenquote,
# Datenanker Reihe 12 (IWF WEO). T51 nennt fuer beide Grenzen keine
# Zahl und keine Bedingung; beide sind gegen den historischen Pfad zu
# pruefen. Der Saldo ist im Pruefjahrgang in mehreren Laendern deutlich
# negativ, der Platzhalter deshalb weit nach unten offen.
# Kalibriert: Selbstspieler (`schrittweite`).
# Scheitert daran: wie beim Zoll.
[instrument.haushalt]
schrittweite = 1  # PLATZHALTER
instrument_min = -10000  # PLATZHALTER
instrument_max = 10000  # PLATZHALTER

# Klasse 10 (Instrumentenstufe). Kapitalverkehrs- und
# Finanzmarktregulierung: **kein Datenanker, reines Modellkonstrukt**
# (spiel.md, T5 Klasse 10). Alle drei Werte legt T51 fest, keiner ist
# kalibrierbar:
#   `schrittweite`   = 1  ("hoechstens ein Schritt je Runde" heisst hier
#                          **eine Stufe**, T5 Klasse 10, T51)
#   `instrument_min` = 0  (Wertebereich `0 ... regulierung_stufen`, T51)
#   `instrument_max` = `regulierung_stufen` (ebd.)
# **`instrument_max` ist damit eine zweite Kopie von
# `regulierung_stufen`.** Das ist genau der Fehlertyp, den T45 fuer
# Adressen ausschliesst -- eine Groesse mit zwei Herren. Die Vorgabe
# erzeugt ihn, dieses Paket kann ihn nicht aufloesen (das waere eine
# Abweichung von specs/ und braeuchte einen ADR). Auflage an das Paket,
# das diese Datei einliest: **Gleichheit pruefen und bei Ungleichheit
# abbrechen**, nicht eine der beiden Zahlen bevorzugen. Als Befund
# vermerkt.
# Scheitert daran: Nichts -- hier ist nichts zu kalibrieren. Der Regler
#   dieses Instruments heisst `regulierung_stufen`.
[instrument.regulierung]
schrittweite = 1  # FEST (T51)
instrument_min = 0  # FEST (T51)
instrument_max = 1  # FEST (T51), muss `regulierung_stufen` gleichen


# =====================================================================
# BEFUNDE -- was ein Pruefer wissen muss, bevor er zaehlt
#
# 1. **25 der 50 Namen sind gebildet, nicht zitiert.** Woertlich in
#    specs/ stehen: stufenweite, stufen_max, ausstiegsabschlag,
#    zwangsabschlag, aufschlag, lobbykosten, beteiligungsrabatt,
#    gegenlobby_satz, druck_max, regulierung_stufen, schwelle_v,
#    schwelle_e, startkapital sowie schrittweite / instrument_min /
#    instrument_max in den vier Instrumententabellen (12 Schluessel).
#    Gebildet sind die uebrigen 25: startzustimmung, regulierung_start
#    (beide schon in Paket 0007 so gebildet und dort markiert),
#    aufsicht_schwelle_1/_2/_3, aufsicht_max, nachahmer_tempo,
#    nachahmer_max, anlegerabzug_anteil, die vier Verzoegerungen und die
#    zwoelf der Gruppe C.
#
# 2. **T27 nennt "Elastizitaeten", specs/ nennt keine einzige.** Die
#    zwoelf Schluessel der Gruppe C sind nach der oben genannten Regel
#    ausgewaehlt (benannte Wirkung, braucht eine Zahl, hat sonst kein
#    Zuhause). Ob es genau diese zwoelf sind, entscheidet erst das Paket,
#    das Schritt 3 bis 5 baut. Hier ist sowohl ein Regler zu viel als
#    auch einer zu wenig moeglich.
#
# 3. **`startkapital` bestimmt zwei Adressen** -- `fonds.kasse` und
#    `fonds.anlegerbestand` (spiel.md, T45; so auch im
#    Adressverzeichnis aus Paket 0007). Wer den Anlegerbestand vom
#    Startkapital trennen will, braucht einen ADR.
#
# 4. **`instrument_max[regulierung]` und `regulierung_stufen` sind
#    dieselbe Zahl** (T51). Auflage: Gleichheit beim Einlesen pruefen,
#    Ungleichheit ist ein Abbruch.
#
# 5. **`aufschlag` und `instrument_min[leitzins]` sind gekoppelt**
#    (`instrument_min >= 1 - aufschlag`, T51). Diese Datei haelt die
#    Kopplung mit 51 und -50 ein. Sie ist die einzige Stelle, an der
#    zwei Platzhalter voneinander abhaengen; wer einen aendert, prueft
#    den anderen.
#
# 6. **`startzustimmung` und `regulierung_start` tragen je vier
#    Adressen** -- ein Wert fuer alle vier spielbaren Laender. So zaehlt
#    T45 (`4x2` von elf Parameteradressen). Ein Startwert je Land waere
#    eine andere Zaehlung und braeuchte einen ADR.
#
# 7. **Nicht abgedeckt, weil nirgends gefordert:** ein Schluessel fuer
#    die Obergrenze der Klasse-11-Zaehler `land.<L>.aufsichtszaehler`
#    und Nachahmerzaehler ist mit `aufsicht_max` und `nachahmer_max`
#    gesetzt; fuer die uebrigen Zaehler der Klasse 11 (Runde,
#    Mandatsstand, Restdauern) nennt T5 ebenfalls "Obergrenze aus
#    parameter.toml", ohne dass eine Modellregel eine braeuchte -- Runde
#    und Mandatsstand sind durch R begrenzt (T40), die Restdauern durch
#    die vier Dauern der Gruppe B2. Deshalb steht dafuer kein
#    Schluessel hier.
# =====================================================================
