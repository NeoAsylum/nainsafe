# ---------------------------------------------------------------------
# GRUPPE C -- "Elastizitaeten" (T27)
#
# **Hier ist die Datei am schwaechsten, und das gehoert an den Anfang der
# Gruppe und nicht ans Ende.** T27 zaehlt "Elastizitaeten" als
# Kalibriergroesse auf; **weder spiel.md noch technik.md nennt eine
# einzige davon beim Namen.** Die zwoelf Schluessel unten sind deshalb
# alle gebildet. Ausgewaehlt sind sie nach genau einer Regel: Es gibt
# eine in spiel.md **benannte** Wirkung, sie braucht eine Zahl, und die
# Zahl hat sonst kein Zuhause -- keinen Datenanker, kein Manifestfeld,
# keine Vorgabe in technik.md. Je Schluessel steht die Fundstelle dabei.
#
# Zwei Fehler sind hier moeglich, und keinen kann dieses Paket
# ausschliessen: eine Wirkung zu viel (ein Regler ohne Modellregel) oder
# eine zu wenig (eine Modellregel ohne Regler). Abschliessend beantworten
# kann das erst das Paket, das Schritt 3 bis 5 baut. Als Befund vermerkt.
# ---------------------------------------------------------------------

